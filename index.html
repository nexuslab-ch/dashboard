}
const MODELES_MAIL = {
  vide: { titre: "Message libre", sujet: () => "", corps: () => `Bonjour,\n\n\n\nMeilleures salutations,` },
  merci: {
    titre: "Merci pour l’entretien",
    sujet: () => "Merci pour votre accueil",
    corps: ({ c, e }) => `Bonjour,\n\nMerci encore de nous avoir reçus${e ? " le " + dateFr(e.date) : ""}. Ça nous a beaucoup aidés de comprendre comment vous travaillez au quotidien chez ${c?.nom || "vous"}.\n\nComme promis, on revient vers vous avec une proposition adaptée à ce qui vous fait perdre du temps. Si quelque chose vous revient d’ici là, vous pouvez simplement répondre à ce mail.\n\nMeilleures salutations,`,
  },
  relance: {
    titre: "Relance",
    sujet: () => "Suite à notre échange",
    corps: ({ dernier }) => `Bonjour,\n\nJe me permets de revenir vers vous suite à notre échange${dernier ? " du " + dateFr(dernier.date) : ""}. Est-ce que vous avez eu le temps d’y réfléchir ?\n\nSi c’est plus simple, on peut aussi en parler de vive voix : il suffit de me dire quand ça vous arrange.\n\nMeilleures salutations,`,
  },
  devis: {
    titre: "Envoi du devis",
    sujet: ({ d }) => d ? `Votre devis ${d.numero}` : "Votre devis",
    corps: ({ d }) => `Bonjour,\n\nVous trouverez en annexe notre devis${d ? " " + d.numero : ""}${d?.objet ? " pour " + d.objet.charAt(0).toLowerCase() + d.objet.slice(1) : ""}. Il reprend le contenu, le prix et le délai dont on a parlé.\n\nEst-ce que vous pourriez nous faire un retour${d?.echeance ? " d’ici le " + dateFr(d.echeance) : " dans les prochains jours"} ? Si vous avez des questions ou si vous souhaitez adapter quelque chose, je reste volontiers à disposition.\n\nMeilleures salutations,`,
  },
};
const mailsDe = (clientId) => db.mails_envoyes.filter((x) => x.client_id === clientId);

function ecrireMail(clientId, defauts = {}) {
  if (absente("mails_envoyes")) { toast("L’envoi de mails n’est pas encore installé : lance la migration 010 dans Supabase.", "erreur"); return; }
  const c = parId("clients", clientId);
  const docs = db.devis_factures.filter((d) => d.client_id === clientId && d.statut !== "annule");
  const e = (db.entretiens || []).find((x) => x.client_id === clientId);
  const dernier = contactsDe(clientId)[0];
  const modele = defauts.modele || (defauts.devis_id ? "devis" : e && !mailsDe(clientId).length ? "merci" : "vide");
  const d0 = parId("devis_factures", defauts.devis_id) || (modele === "devis" ? docs.find((d) => d.type === "devis") : null);
  const ctx = (d) => ({ c, e, d, dernier });
  const docsClient = clientId ? db.documents.filter((x) => x.client_id === clientId && x.fichier_path) : [];
  let fichiersPj = [];
  const LIMITE_PJ = 10 * 1048576;
  const champs = [
    { nom: "destinataire", label: "À", requis: true, placeholder: "adresse@client.ch", aide: "Plusieurs adresses : séparer par une virgule.", pleine: true, auto: "email" },
    { nom: "copie", label: "Copie (Cc)", placeholder: "Facultatif", auto: "email" },
    { nom: "cci", label: "Copie cachée (Cci)", placeholder: "Facultatif", auto: "email" },
    { nom: "modele", label: "Modèle", type: "select", options: Object.entries(MODELES_MAIL).map(([k, m]) => [k, m.titre]), vide: false },
    { nom: "devis_id", label: "Joindre un devis ou une facture", type: "select", options: docs.map((d) => [d.id, `${d.type === "devis" ? "Devis" : "Facture"} ${d.numero}${d.pdf_path ? "" : " (PDF à générer)"}`]), vide: "Aucune pièce jointe" },
    { nom: "sujet", label: "Objet", requis: true, pleine: true },
    { nom: "corps", label: "Message", type: "textarea", rows: 13, requis: true, pleine: true },
  ];
  const m = MODELES_MAIL[modele];
  formulaire({
    titre: c ? `Mail à ${c.nom}` : "Nouveau mail", champs, large: true, texteBouton: "Envoyer",
    valeurs: { destinataire: defauts.destinataire || c?.email || "", modele, devis_id: d0?.id || "", sujet: defauts.sujet || m.sujet(ctx(d0)), corps: defauts.corps || m.corps(ctx(d0)) },
    extra: `<div class="pj-bloc">
        <div class="pj-entete"><span class="label">Pièces jointes</span><label class="bouton-pj">${icone("documents")}<span>Joindre des fichiers</span><input type="file" multiple data-pj-fichiers hidden></label></div>
        ${docsClient.length ? `<details class="pj-docs"><summary>Documents de la fiche client (${docsClient.length})</summary><div>${docsClient.map((x) => `<label><input type="checkbox" data-pj-doc value="${esc(x.id)}"> <span>${esc(x.nom)}</span><small>${esc(tailleFichier(x.taille))}</small></label>`).join("")}</div></details>` : ""}
        <ul class="pj-liste" data-pj-liste></ul>
        <small class="muted" data-pj-total>Jusqu’à 10 Mo au total. Pour un fichier plus lourd, mets plutôt un lien.</small>
      </div>
      <div class="sig-apercu"><div class="sig-entete"><span class="muted petit">Signature ajoutée automatiquement</span>${moi() ? `<button type="button" class="lien petit" data-sig-modifier>Modifier ma signature</button>` : ""}</div>${signatureApercu()}</div>
      <p class="muted petit" style="margin:14px 0 0">Part de ${esc(prenomMembre(moi()) || "NexusLab")}, NexusLab &lt;contact@nexus-lab.ch&gt;. Les réponses arrivent dans Mails et sur nexuslab.mpa@gmail.com.${c ? " Le mail est noté dans le suivi du client." : ""}</p>`,
    apresOuverture: (form) => {
      let touche = false;
      form.elements.corps.addEventListener("input", () => (touche = true));
      form.elements.sujet.addEventListener("input", () => (touche = true));
      const appliquer = async () => {
        if (touche && !(await confirmer("Remplacer ton texte par le modèle ?", "Remplacer"))) return;
        const mm = MODELES_MAIL[form.elements.modele.value];
        let d = parId("devis_factures", form.elements.devis_id.value);
        if (form.elements.modele.value === "devis" && !d) { d = docs.find((x) => x.type === "devis"); if (d) form.elements.devis_id.value = d.id; }
        form.elements.sujet.value = mm.sujet(ctx(d)); form.elements.corps.value = mm.corps(ctx(d)); touche = false;
      };
      form.querySelector("[data-sig-modifier]")?.addEventListener("click", () => { fermerModale(); editerMembre(moi().id); });
      const majPj = () => {
        const docsCoches = $$("[data-pj-doc]:checked", form).map((x) => parId("documents", x.value)).filter(Boolean);
        const total = fichiersPj.reduce((n, f) => n + f.size, 0) + docsCoches.reduce((n, x) => n + (Number(x.taille) || 0), 0);
        $("[data-pj-liste]", form).innerHTML = fichiersPj.map((f, i) => `<li><span>${esc(f.name)}</span><small>${esc(tailleFichier(f.size))}</small><button type="button" class="icone-btn" data-pj-retirer="${i}" aria-label="Retirer ${esc(f.name)}">×</button></li>`).join("");
        const t = $("[data-pj-total]", form);
        t.textContent = total ? `${tailleFichier(total)} sur 10 Mo${total > LIMITE_PJ ? " : trop lourd, retire un fichier ou mets un lien." : ""}` : "Jusqu’à 10 Mo au total. Pour un fichier plus lourd, mets plutôt un lien.";
        t.classList.toggle("erreur-texte", total > LIMITE_PJ);
      };
      $("[data-pj-fichiers]", form).addEventListener("change", (ev) => { fichiersPj = fichiersPj.concat([...ev.target.files]); ev.target.value = ""; majPj(); });
      $("[data-pj-liste]", form).addEventListener("click", (ev) => { const b = ev.target.closest("[data-pj-retirer]"); if (b) { fichiersPj.splice(Number(b.dataset.pjRetirer), 1); majPj(); } });
      $$("[data-pj-doc]", form).forEach((x) => x.addEventListener("change", majPj));
      form.elements.modele.addEventListener("change", appliquer);
      form.elements.devis_id.addEventListener("change", () => { if (form.elements.modele.value === "devis") appliquer(); });
      if (!c?.email) form.elements.destinataire.focus();
    },
    enregistrer: async (v, form) => {
      const d = parId("devis_factures", v.devis_id);
      if (d && !d.pdf_path) throw new Error(`Le PDF de ${d.numero} n’existe pas encore : ouvre-le dans Devis et factures et clique sur PDF, puis réessaie.`);
      const docsCoches = $$("[data-pj-doc]:checked", form).map((x) => parId("documents", x.value)).filter(Boolean);
      const total = fichiersPj.reduce((n, f) => n + f.size, 0) + docsCoches.reduce((n, x) => n + (Number(x.taille) || 0), 0);
      if (total > LIMITE_PJ) throw new Error("Les pièces jointes dépassent 10 Mo : retire un fichier ou envoie plutôt un lien.");
      // Les fichiers joints sont d'abord rangés dans les documents (fiche client), puis la fonction les lit de là.
      const pieces = docsCoches.map((x) => ({ chemin: x.fichier_path, nom: x.nom }));
      for (const f of fichiersPj) {
        const chemin = `${clientId || "sans-client"}/mails/${Date.now()}-${nomFichierSur(f.name)}`;
        const { error: eUp } = await sb.storage.from(CONFIG.bucket).upload(chemin, f, { contentType: f.type || undefined, upsert: false });
        if (eUp) throw new Error(`Impossible de charger ${f.name} : ${eUp.message}`);
        if (clientId) await sb.from("documents").insert({ client_id: clientId, nom: f.name, type: "autre", fichier_path: chemin, taille: f.size, mime: f.type || null });
        pieces.push({ chemin, nom: f.name });
      }
      const { data, error } = await sb.functions.invoke("envoyer-mail", { body: { client_id: clientId || null, destinataire: v.destinataire, copie: v.copie, cci: v.cci, sujet: v.sujet, corps: v.corps, devis_id: v.devis_id || null, pieces, modele: v.modele } });
      if (error) {
        let msg = "L’envoi n’a pas abouti.";
        try { const j = await error.context.json(); if (j?.erreur) msg = j.erreur; } catch { if (/Failed to send|FunctionsFetchError/i.test(error.message || "")) msg = "Le service d’envoi n’est pas encore en ligne (fonction envoyer-mail)."; }
        throw new Error(msg);
      }
      if (data?.erreur) throw new Error(data.erreur);
      await Promise.all([charger("mails_envoyes"), charger("contacts_clients"), charger("devis_factures"), ...(fichiersPj.length && clientId ? [charger("documents")] : [])]);
      const premier = v.destinataire.split(/[,;]\s*/)[0];
      if (c && !c.email && premier) await enregistrer("clients", { email: premier }, c.id);
      toast(`Mail envoyé${c ? " à " + c.nom : ""}.`);
    },
  });
}

function voirMailRecu(id) {

function repondreMail(id) {
  const x = parId("mails_recus", id);
  if (!x) return;
  fermerModale();
  const sujet = /^re\s*:/i.test(x.sujet || "") ? x.sujet : `Re: ${x.sujet || ""}`;
  const cite = String(x.texte || "").split("\n").slice(0, 40).map((l) => "> " + l).join("\n");
  const date = new Date(x.recu_le).toLocaleString("fr-CH", { dateStyle: "long", timeStyle: "short" });
  ecrireMail(x.client_id || null, { destinataire: x.expediteur, sujet, modele: "vide", corps: `Bonjour,\n\n\n\nMeilleures salutations,\n\n\nLe ${date}, ${x.expediteur_nom || x.expediteur} a écrit :\n${cite}` });
}

const estAssocie = () => { const m = moi(); return !!(m && m.actif && !m.acces_jusquau); };

function editerRecette(id) {
  if (!estAssocie()) { toast("Réservé aux associés.", "erreur"); return; }
  const r = parId("recettes", id);
  formulaire({
    titre: r ? `Modifier ${numeroRecette(r)}` : "Nouvelle fiche de service", champs: champsRecette(), large: true,
    valeurs: r || { categorie: "outil", statut: "brouillon", version: "0.1", date_version: aujourdhui(), responsable_id: moi()?.id },
    enregistrer: async (v) => {
      const enr = await enregistrer("recettes", v, id);
      await Promise.all([charger("recettes"), charger("recettes_historique")]);
      toast(r ? "Fiche enregistrée. L’ancienne version est dans l’historique." : "Fiche créée.");
      if (!r && enr?.id) location.hash = "#/confidentiel/" + enr.id;
    },
    supprimer: r ? () => supprimerLigne("recettes", id) : null,
  });
}
function blocTexte(cle, titre, copiable, r) {
  const v = r[cle];
  if (!v) return `<section class="carte recette-bloc"><header><h2>${esc(titre)}</h2></header><p class="muted petit">Pas encore rempli.</p></section>`;
  const corps = cle === "checklist"
    ? `<ul class="recette-check">${v.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`
    : `<div class="${copiable ? "recette-code" : "texte-libre"}">${esc(v)}</div>`;

async function ajouterFichiersRecette(recetteId, fichiers, role) {
  if (!fichiers.length) return;
  const trop = fichiers.find((f) => f.size > 52428800);
  if (trop) { toast(`${trop.name} dépasse 50 Mo.`, "erreur"); return; }
  toast(fichiers.length > 1 ? `Envoi de ${fichiers.length} fichiers…` : "Envoi du fichier…");
  try {
    for (const f of fichiers) {
      const chemin = `${recetteId}/${Date.now()}-${nomFichierSur(f.name)}`;
      const { error } = await sb.storage.from(BUCKET_CONF).upload(chemin, f, { contentType: f.type || undefined, upsert: false });
      if (error) throw error;
      const { error: e2 } = await sb.from("recettes_fichiers").insert({ recette_id: recetteId, nom: f.name, role, chemin, taille: f.size, mime: f.type || null });
      if (e2) { await sb.storage.from(BUCKET_CONF).remove([chemin]); throw e2; }
    }
    await charger("recettes_fichiers"); rendre();
    toast(fichiers.length > 1 ? `${fichiers.length} fichiers ajoutés.` : "Fichier ajouté.");
  } catch (err) { toast(msgErreur(err), "erreur"); }
}
async function ouvrirFichierRecette(id) {
  const f = (db.recettes_fichiers || []).find((x) => x.id === id);
  if (!f) return;
  const texte = /\.(md|txt|json|csv|css|js|ts|py|sql)$/i.test(f.nom) || /^text\/(plain|markdown|csv)/.test(f.mime || "");
  if (texte) {
    const { data, error } = await sb.storage.from(BUCKET_CONF).download(f.chemin);
    if (error) { toast(msgErreur(error), "erreur"); return; }
    const contenu = await data.text();
    fenetre(f.nom, `<div class="boutons" style="margin-bottom:12px"><button class="btn mini" data-action="copierTexteFichier">Copier</button></div><div class="recette-code" data-texte-fichier style="max-height:none">${esc(contenu)}</div>`, true);
    return;
  }
  const fen = window.open("", "_blank");
  if (f.mime === "text/html" || /\.html?$/i.test(f.nom)) {
    const { data: fichier, error } = await sb.storage.from(BUCKET_CONF).download(f.chemin);
    if (error) { if (fen) fen.close(); toast(msgErreur(error), "erreur"); return; }
    const contenu = (await fichier.text()).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    const cadre = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(f.nom)}</title><style>html,body{margin:0;height:100%;background:#fff}iframe{border:0;display:block;width:100%;height:100%}</style></head><body><iframe sandbox="allow-scripts allow-downloads allow-forms allow-modals allow-popups" srcdoc="${contenu}"></iframe></body></html>`;
    const lien = URL.createObjectURL(new Blob([cadre], { type: "text/html;charset=utf-8" }));
    if (fen) fen.location.href = lien; else location.href = lien;
    setTimeout(() => URL.revokeObjectURL(lien), 60000);
    return;
  }
  const { data, error } = await sb.storage.from(BUCKET_CONF).createSignedUrl(f.chemin, 300);
  if (error) { if (fen) fen.close(); toast(msgErreur(error), "erreur"); return; }
  if (fen) fen.location.href = data.signedUrl; else location.href = data.signedUrl;
}

      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${esc(o.nom)}</h2>${o.active ? '<span class="badge t-vert">Active</span>' : '<span class="badge t-gris">Inactive</span>'}</div>

      ${o.inclus?.length ? `<ul>${o.inclus.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : ""}
      ${o.conditions ? `<p class="muted petit" style="margin:0">${esc(o.conditions)}</p>` : ""}

function pageDevis() {
  const f = filtres.devis;
  const auj = aujourdhui();
  const retard = db.devis_factures.filter((d) => d.type === "facture" && d.statut === "envoye" && d.echeance && d.echeance < auj);
  return `
  <div class="entete"><div><h1>Devis et factures</h1><div class="sous-titre">Création, PDF au format NexusLab avec QR-facture, suivi des paiements</div></div>
    <div class="boutons"><button class="btn" data-action="nouveauDf" data-type="facture">${icone("plus")}Facture</button><button class="btn primaire" data-action="nouveauDf" data-type="devis">${icone("plus")}Devis</button></div></div>
  ${retard.length ? `<div class="message erreur" style="margin-bottom:16px">${retard.length} facture${retard.length > 1 ? "s" : ""} en retard de paiement : ${retard.map((d) => esc(d.numero + " (" + nomClient(d.client_id) + ")")).join(", ")}.</div>` : ""}
  <div class="filtres">
    <div class="onglets" role="group" aria-label="Type">${[["", "Tous"], ["devis", "Devis"], ["facture", "Factures"]].map(([k, l]) => `<button aria-pressed="${f.type === k}" data-action="puce" data-filtre="devis.type" data-valeur="${k}">${l}</button>`).join("")}</div>
    <select data-filtre="devis.statut" aria-label="Statut"><option value="">Tous les statuts</option>${options("statutDf").map(([k, l]) => `<option value="${k}"${f.statut === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>
    <input type="search" placeholder="Numéro, client, objet" value="${esc(f.q)}" data-filtre="devis.q" aria-label="Rechercher">
  </div>
  <section class="carte sans-marge" id="liste-devis">${listeDevis()}</section>`;

function listeDevis() {
  const f = filtres.devis, q = f.q.toLowerCase();
  const l = db.devis_factures.filter((d) => (!f.type || d.type === f.type) && (!f.statut || d.statut === f.statut) && (!q || [d.numero, nomClient(d.client_id), d.objet].join(" ").toLowerCase().includes(q)));
  const total = l.filter((d) => d.statut !== "annule").reduce((s, d) => s + Number(d.montant_ttc || 0), 0);
  return `<div style="padding:8px 8px 6px">${tableDf(l, true)}</div>${l.length ? `<div class="petit muted" style="padding:0 22px 14px;text-align:right">${l.length} élément${l.length > 1 ? "s" : ""} · total hors annulés ${chf(total)}</div>` : ""}`;

function nouvelleLigneHtml(l = {}) {
  return `<tr><td><input data-l="description" value="${esc(l.description || "")}" placeholder="Prestation" aria-label="Description"></td>
    <td class="c-q"><input data-l="quantite" type="number" step="0.25" min="0" value="${l.quantite ?? 1}" aria-label="Quantité"></td>
    <td class="c-p"><input data-l="prix" type="number" step="0.05" value="${l.prix ?? 0}" aria-label="Prix unitaire"></td>
    <td class="c-t num total"></td><td class="c-x"><button type="button" class="icone-btn" data-suppr-ligne aria-label="Retirer la ligne">×</button></td></tr>`;
}
function editeurDf(id, defauts = {}) {
  const p = parametres();
  const ex = parId("devis_factures", id);
  const type = ex ? ex.type : defauts.type || "devis";
  const d = ex ? { ...ex } : {
    type, client_id: defauts.client_id || null, projet_id: defauts.projet_id || null, objet: "",
    lignes: [{ description: "", quantite: 1, prix: 0 }], taux_tva: Number(p.taux_tva_defaut || 0), statut: "brouillon",
    date_emission: aujourdhui(), echeance: ajouterJours(aujourdhui(), type === "facture" ? p.delai_paiement_jours || 30 : p.validite_devis_jours || 30),
  };
  const champs = [
    { nom: "client_id", label: "Client", type: "select", options: optClients(), requis: true, vide: "Choisir un client" },
    { nom: "projet_id", label: "Site lié", type: "select", options: optProjets() },
    { nom: "objet", label: "Objet", pleine: true, placeholder: type === "devis" ? "Création du site vitrine" : "Création du site vitrine, solde" },
    { nom: "date_emission", label: "Date", type: "date", requis: true },
    { nom: "echeance", label: type === "facture" ? "Échéance de paiement" : "Valable jusqu’au", type: "date" },
    { nom: "statut", label: "Statut", type: "select", options: options("statutDf", STATUTS_DF_PAR_TYPE[type]), vide: false, defaut: "brouillon" },
    { nom: "taux_tva", label: "TVA (%)", type: "number", step: "0.1", min: 0, defaut: 0, aide: Number(p.taux_tva_defaut) ? "" : "0 tant que NexusLab n’est pas assujetti." },
    ...(type === "facture" ? [{ nom: "date_paiement", label: "Payée le", type: "date" }] : []),
    { nom: "notes", label: "Remarques (imprimées sur le PDF)", type: "textarea", pleine: true, rows: 2 },
  ];
  const lignes = Array.isArray(d.lignes) && d.lignes.length ? d.lignes : [{ description: "", quantite: 1, prix: 0 }];
  const extra = `<h3 style="margin:18px 0 4px">Prestations</h3>
    <div class="table-wrap"><table class="lignes"><thead><tr><th>Description</th><th class="c-q">Quantité</th><th class="c-p">Prix unitaire</th><th class="c-t num">Total</th><th class="c-x"></th></tr></thead><tbody id="lignes-corps">${lignes.map(nouvelleLigneHtml).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button type="button" class="btn mini" id="ajout-ligne">${icone("plus")}Ligne</button>
      <select id="ajout-offre" class="statut-rapide" aria-label="Ajouter une offre"><option value="">Ajouter une offre...</option>${db.offres.filter((o) => o.active).map((o) => !offreDeuxModes(o) ? `<option value="${o.id}">${esc(o.nom)} (${chfCourt(o.prix_depart)})</option>`
        : (o.prix_creation != null ? `<option value="${o.id}|unique">${esc(o.nom)}, paiement unique (${chfCourt(o.prix_creation)}${o.forfait_annuel != null ? " + " + chfCourt(o.forfait_annuel) + "/an" : ""})</option>` : "")
        + (o.prix_mensuel != null ? `<option value="${o.id}|mois">${esc(o.nom)}, ${o.type === "option" ? "abonnement" : "tout au mois"} (${chfCourt(o.prix_mensuel)}/mois)</option>` : "")).join("")}</select></div>
    <div class="totaux" id="totaux"></div>`;
  const titre = ex ? `${type === "devis" ? "Devis" : "Facture"} ${ex.numero}` : type === "devis" ? "Nouveau devis" : "Nouvelle facture";
  let pdfApres = false;

  formulaire({
    titre, champs, valeurs: d, extra, large: true,
    enregistrer: async (v, form) => {
      const avecPdf = pdfApres; pdfApres = false;
      const lg = $$("#lignes-corps tr", form).map((tr) => ({
        description: $('[data-l="description"]', tr).value.trim(),
        quantite: Number($('[data-l="quantite"]', tr).value) || 0,
        prix: Number($('[data-l="prix"]', tr).value) || 0,
      })).filter((l) => l.description || l.prix);
      if (!lg.length) throw new Error("Ajoutez au moins une prestation.");
      v.lignes = lg;
      v.montant_ht = arrondi(lg.reduce((s, l) => s + arrondi(l.quantite * l.prix), 0));
      if (v.statut === "paye" && !v.date_paiement) v.date_paiement = aujourdhui();
      let r;
      if (ex) r = await enregistrer("devis_factures", v, id);
      else {
        const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: type });
        if (error) throw error;
        r = await enregistrer("devis_factures", { ...v, type, numero });
      }
      toast(`${type === "devis" ? "Devis" : "Facture"} ${r.numero} enregistré${type === "facture" ? "e" : ""}.`);
      if (avecPdf) await telechargerPdf(r.id);
    },
    supprimer: ex ? () => supprimerLigne("devis_factures", id) : null,
    apresOuverture: (form) => {
      const corps = $("#lignes-corps", form);
      const recalcul = () => {
        let ht = 0;
        for (const tr of $$("tr", corps)) {
          const t = arrondi((Number($('[data-l="quantite"]', tr).value) || 0) * (Number($('[data-l="prix"]', tr).value) || 0));
          ht += t; $(".total", tr).textContent = fmtNombre.format(t);
        }
        ht = arrondi(ht);
        const taux = Number(form.elements.taux_tva.value) || 0, tva = arrondi((ht * taux) / 100);
        $("#totaux", form).innerHTML = `<div><span>Sous-total HT</span><span class="num">${chf(ht)}</span></div>${taux ? `<div><span>TVA ${taux} %</span><span class="num">${chf(tva)}</span></div>` : ""}<div class="ttc"><span>Total</span><span class="num">${chf(ht + tva)}</span></div>`;
      };
      form.addEventListener("input", recalcul);
      corps.addEventListener("click", (e) => { if (e.target.closest("[data-suppr-ligne]")) { e.target.closest("tr").remove(); if (!$("tr", corps)) corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); recalcul(); } });
      $("#ajout-ligne", form).addEventListener("click", () => { corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); $("tr:last-child input", corps).focus(); recalcul(); });
      $("#ajout-offre", form).addEventListener("change", (e) => {
        const [oid, mode] = e.target.value.split("|"), o = parId("offres", oid); e.target.value = "";
        if (!o) return;
        const premiere = $("tr", corps);
        if (corps.children.length === 1 && premiere && !$('[data-l="description"]', premiere).value) premiere.remove();
        const lignes = mode === "unique" ? [{ description: `Offre ${o.nom} : création`, quantite: 1, prix: Number(o.prix_creation) }].concat(o.forfait_annuel != null ? [{ description: `Offre ${o.nom} : forfait annuel${o.forfait_annuel_detail ? " (" + o.forfait_annuel_detail + ")" : ""}`, quantite: 1, prix: Number(o.forfait_annuel) }] : [])
          : mode === "mois" ? [{ description: `Offre ${o.nom} : mensualité${o.engagement_mois ? ", engagement " + o.engagement_mois + " mois" : ", sans engagement"}`, quantite: o.engagement_mois || 1, prix: Number(o.prix_mensuel) }]
          : [{ description: `Offre ${o.nom}${o.periode !== "unique" ? " (" + libelle("periode", o.periode).toLowerCase() + ")" : ""}`, quantite: 1, prix: Number(o.prix_depart || 0) }];
        for (const l of lignes) corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml(l));
        if (!form.elements.objet.value) form.elements.objet.value = "Offre " + o.nom;
        recalcul();
      });
      form.elements.projet_id.addEventListener("change", (e) => { const pr = parId("projets", e.target.value); if (pr?.client_id && !form.elements.client_id.value) form.elements.client_id.value = pr.client_id; });
      recalcul();
      // Boutons supplémentaires : PDF, transformer en facture, payée
      const pied = $("footer", form), envoi = $('[type="submit"]', pied);
      const bPdf = document.createElement("button");
      bPdf.type = "button"; bPdf.className = "btn"; bPdf.innerHTML = icone("pdf") + "Enregistrer et PDF";
      bPdf.addEventListener("click", () => { pdfApres = true; form.requestSubmit(envoi); });
      envoi.addEventListener("click", () => (pdfApres = false));
      pied.insertBefore(bPdf, envoi);
      if (ex && ex.type === "devis" && ["envoye", "accepte"].includes(ex.statut)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Transformer en facture";
        b.addEventListener("click", () => facturerDevis(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
      if (ex && ex.type === "facture" && ex.statut === "envoye") {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Marquer payée";
        b.addEventListener("click", () => marquerPayee(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
    },
  });
}
async function facturerDevis(id) {
  const d = parId("devis_factures", id);
  if (!d || !(await confirmer(`Créer une facture à partir du devis ${d.numero} ?`, "Créer la facture"))) return;
  try {
    const p = parametres();
    const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: "facture" });
    if (error) throw error;
    const f = await enregistrer("devis_factures", {
      type: "facture", numero, client_id: d.client_id, projet_id: d.projet_id, objet: d.objet, lignes: d.lignes,
      montant_ht: d.montant_ht, taux_tva: d.taux_tva, statut: "brouillon", date_emission: aujourdhui(),
      echeance: ajouterJours(aujourdhui(), p.delai_paiement_jours || 30), devis_origine_id: d.id, notes: d.notes,
    });
    await enregistrer("devis_factures", { statut: "facture" }, d.id);
    const c = parId("clients", d.client_id);
    if (c && ["prospect", "contacte", "rendez_vous", "offre_envoyee"].includes(c.statut)) await enregistrer("clients", { statut: "mandat_signe" }, c.id);
    fermerModale(); rendre(); toast(`Facture ${f.numero} créée.`);
    editeurDf(f.id);
  } catch (err) { toast(msgErreur(err), "erreur"); }
}
async function marquerPayee(id) {
  try { await enregistrer("devis_factures", { statut: "paye", date_paiement: aujourdhui() }, id); fermerModale(); rendre(); toast("Facture marquée payée."); }
  catch (err) { toast(msgErreur(err), "erreur"); }
}

function pageTaches() {
  const f = filtres.taches;
  return `
  <div class="entete"><div><h1>Tâches</h1><div class="sous-titre">R : responsable, celui qui fait · A : valideur, celui qui valide</div></div>
    <div class="boutons"><button class="btn primaire" data-action="nouvelleTache">${icone("plus")}Nouvelle tâche</button></div></div>
  <div class="filtres">
    <div class="onglets" role="group" aria-label="Vue">${[["statut", "Par statut"], ["personne", "Par personne"], ["sprint", "Par sprint"]].map(([k, l]) => `<button aria-pressed="${f.vue === k}" data-action="puce" data-filtre="taches.vue" data-valeur="${k}">${l}</button>`).join("")}</div>
    <select data-filtre="taches.sprint" aria-label="Sprint"><option value="">Tous les sprints</option>${sprints().map((s) => `<option${f.sprint === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <select data-filtre="taches.personne" aria-label="Personne"><option value="">Toute l’équipe</option>${db.membres.map((m) => `<option value="${m.id}"${f.personne === m.id ? " selected" : ""}>${esc(m.nom)}</option>`).join("")}</select>
    <select data-filtre="taches.projet" aria-label="Site"><option value="">Tous les sites</option>${db.projets.map((p) => `<option value="${p.id}"${f.projet === p.id ? " selected" : ""}>${esc(p.nom)}</option>`).join("")}</select>

  </div>
  <div id="liste-taches">${listeTaches()}</div>`;
}
function tachesFiltrees() {
  const f = filtres.taches;
  return db.taches.filter((t) => (!f.sprint || t.sprint === f.sprint) && (!f.projet || t.projet_id === f.projet)
    && (!f.personne || t.responsable_id === f.personne || t.valideur_id === f.personne) && (f.fait === "1" || t.statut !== "fait"));
}
function carteTache(t) {
  const h = t.heures_estimees != null || t.heures_reelles != null ? `<span title="Heures réelles / estimées">${(Number(t.heures_reelles) || 0).toLocaleString("fr-CH")} / ${(Number(t.heures_estimees) || 0).toLocaleString("fr-CH")} h</span>` : "";
  return `<article class="tache${t.statut === "bloque" ? " bloquee" : ""}" draggable="true" data-id="${t.id}" data-action="modifierTache" tabindex="0">
    ${t.projet_id ? `<div class="projet">${esc(nomProjet(t.projet_id))}</div>` : ""}
    <div class="titre">${esc(t.titre)}</div>
    <div class="bas"><span class="raci">R ${avatar(t.responsable_id, "Responsable (R)")}</span><span class="raci">A ${avatar(t.valideur_id, "Valideur (A)")}</span>
      <span class="droite">${h}${t.echeance ? `<span class="${enRetard(t) ? "retard" : ""}">${dateCourte(t.echeance)}</span>` : ""}</span></div>
    ${filtres.taches.vue !== "statut" ? `<div>${badge("statutTache", t.statut)}${t.sprint && filtres.taches.vue !== "sprint" ? ` <span class="muted petit">${esc(t.sprint)}</span>` : ""}</div>` : t.sprint ? `<div class="muted petit">${esc(t.sprint)}</div>` : ""}
  </article>`;
}
function listeTaches() {
  const f = filtres.taches, l = tachesFiltrees();
  const est = l.reduce((s, t) => s + Number(t.heures_estimees || 0), 0), reel = l.reduce((s, t) => s + Number(t.heures_reelles || 0), 0);
  let cols;
  if (f.vue === "personne") cols = [...membresActifs().map((m) => [m.id, m.nom, l.filter((t) => t.responsable_id === m.id)]), ["", "Non attribuées", l.filter((t) => !parId("membres", t.responsable_id))]].filter((c) => c[0] !== "" || c[2].length);
  else if (f.vue === "sprint") { const s = sprints().filter((x) => !f.sprint || x === f.sprint); cols = [...s.map((x) => [x, x, l.filter((t) => t.sprint === x)]), ["", "Sans sprint", l.filter((t) => !t.sprint)]].filter((c) => c[0] !== "" || c[2].length); }
  else cols = Object.keys(ETIQ.statutTache).filter((k) => k !== "fait" || f.fait === "1").map((k) => [k, libelle("statutTache", k), l.filter((t) => t.statut === k)]);
  return `<div class="resume-heures"><span><strong>${l.filter((t) => t.statut !== "fait").length}</strong> ouvertes</span><span><strong>${l.filter(enRetard).length}</strong> en retard</span><span>Heures estimées <strong>${heures(est)}</strong></span><span>Heures réelles <strong>${heures(reel)}</strong></span></div>
  <div class="kanban">${cols.map(([k, titre, ts]) => `<section class="colonne"${f.vue === "statut" ? ` data-statut="${k}" style="--point:var(--t-${ETIQ.statutTache[k][1]})"` : ""}><header><h3>${esc(titre)}</h3><span class="muted petit">${ts.length}</span></header><div class="cartes">${ts.map(carteTache).join("") || '<div class="muted petit" style="padding:8px 4px">Rien ici.</div>'}</div></section>`).join("")}</div>`;
}
function brancherGlisser() {
  if (filtres.taches.vue !== "statut") return;
  let glisse = null;
  for (const c of $$(".tache")) {
    c.addEventListener("dragstart", (e) => { glisse = c.dataset.id; c.classList.add("glisse"); e.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => c.classList.remove("glisse"));
  }
  for (const col of $$(".colonne[data-statut]")) {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("survol"); });
    col.addEventListener("dragleave", () => col.classList.remove("survol"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("survol");
      const t = parId("taches", glisse);
      if (!t || t.statut === col.dataset.statut) return;
      try { await enregistrer("taches", { statut: col.dataset.statut }, t.id); rendre(); }
      catch (err) { toast(msgErreur(err), "erreur"); }
    });
  }
}

function alerteComptes() {
  const sansFiche = etatComptes.filter((c) => c.a_compte && !c.a_fiche);
  const sansCompte = etatComptes.filter((c) => !c.a_compte && c.a_fiche);
  if (!sansFiche.length && !sansCompte.length) return "";
  const ligne = (c) => `<li><b>${esc(c.email || "(sans e-mail)")}</b>${c.fiche ? ` · fiche ${esc(c.fiche)}` : ""}${c.derniere_connexion ? ` · dernière tentative ${dateFr(String(c.derniere_connexion).slice(0, 10))}` : ""}</li>`;
  return `<section class="carte" style="margin-bottom:16px;border-color:var(--corail, #FF5F57)">

async function ouvrirDocument(id) {
  const d = parId("documents", id);
  if (!d) return;
  const fenetre = window.open("", "_blank");
  // Une page HTML (maquette) est servie en texte brut par le stockage : on la rouvre comme une vraie page,
  // mais isolée dans un cadre « sandbox » sans accès à l'origine du dashboard (ni session, ni données).
  if (d.mime === "text/html" || /\.html?$/i.test(d.nom || "")) {
    const { data: fichier, error: eDl } = await sb.storage.from(CONFIG.bucket).download(d.fichier_path);
    if (eDl) { if (fenetre) fenetre.close(); toast(msgErreur(eDl), "erreur"); return; }
    const contenu = (await fichier.text()).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    const cadre = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(d.nom || "Document")}</title><style>html,body{margin:0;height:100%;background:#fff}iframe{border:0;display:block;width:100%;height:100%}</style></head><body><iframe sandbox="allow-scripts allow-downloads allow-forms allow-modals allow-popups" srcdoc="${contenu}"></iframe></body></html>`;
    const page = new Blob([cadre], { type: "text/html;charset=utf-8" });
    const lien = URL.createObjectURL(page);
    if (fenetre) fenetre.location.href = lien; else location.href = lien;
    setTimeout(() => URL.revokeObjectURL(lien), 60000);
    return;
  }
  const { data, error } = await sb.storage.from(CONFIG.bucket).createSignedUrl(d.fichier_path, 300);
  if (error) { if (fenetre) fenetre.close(); toast(msgErreur(error), "erreur"); return; }
  if (fenetre) fenetre.location.href = data.signedUrl; else location.href = data.signedUrl;
}

function ibanNettoye(i) { return String(i || "").replace(/\s+/g, "").toUpperCase(); }
function ibanValide(i) {
  const s = ibanNettoye(i);
  if (!/^(CH|LI)\d{2}[0-9A-Z]{17}$/.test(s)) return false;
  const r = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, (c) => c.charCodeAt(0) - 55);
  let m = 0; for (const ch of r) m = (m * 10 + Number(ch)) % 97;
  return m === 1;
}

function pdfTexte(s) {

function couper(texte, police, taille, largeur) {
  const lignes = [];
  for (const para of String(texte ?? "").split(/\n/)) {
    const mots = pdfTexte(para).split(" ");
    let l = "";
    for (const m of mots) {
      const essai = l ? l + " " + m : m;
      if (police.widthOfTextAtSize(essai, taille) <= largeur || !l) l = essai; else { lignes.push(l); l = m; }
    }
    lignes.push(l);
  }

async function telechargerPdf(id) {
  const d = parId("devis_factures", id);
  if (!d) return;
  toast("Préparation du PDF...");
  try {
    const octets = await genererPdf(d);
    const blob = new Blob([octets], { type: "application/pdf" });
    const nom = `${d.numero} ${nomClient(d.client_id)}`.trim();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nomFichierSur(nom) + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    // Archive dans la GED (classé par client et par site)
    const chemin = `${d.client_id || "sans-client"}/${d.projet_id || "general"}/${nomFichierSur(d.numero)}.pdf`;
    const { error } = await sb.storage.from(CONFIG.bucket).upload(chemin, blob, { contentType: "application/pdf", upsert: true });
    if (error) throw error;
    const { error: e2 } = await sb.from("documents").upsert({ client_id: d.client_id, projet_id: d.projet_id, nom: `${d.numero}.pdf`, type: d.type, fichier_path: chemin, taille: blob.size, mime: "application/pdf", date: aujourdhui() }, { onConflict: "fichier_path" });
    if (e2) throw e2;
    if (d.pdf_path !== chemin) await enregistrer("devis_factures", { pdf_path: chemin }, d.id);
    await charger("documents");
    rendre();
  } catch (err) { console.error(err); toast("PDF : " + msgErreur(err), "erreur"); }
}

      ev.push({ date: c.date_relance, type: "relance", titre: "Relancer " + c.nom, meta: c.prochaine_action || c.contact || "", href: "#/clients/" + c.id });
    for (const d of db.devis_factures) {

      if (d.type === "devis" && d.statut === "envoye" && dans(d.echeance)) ev.push({ date: d.echeance, type: "devis", titre: `Devis ${d.numero} expire`, meta: nomClient(d.client_id), action: "modifierDf", id: d.id });

const attrsEvt = (e) => (e.href ? `data-href="${e.href}"` : `data-action="${e.action}" data-id="${e.id}"`);

/* « 16h30 », « 16:30-18h », « 9h à 10h15 » : début et fin en minutes (fin par défaut : 1 h après) */
function plageHeure(txt) {
  const t = String(txt || "").toLowerCase().replace(/\s+/g, " ");
  const re = /(\d{1,2})\s*(?:[:h.]\s*(\d{2})?)/g;
  const m = [...t.matchAll(re)].map((x) => Number(x[1]) * 60 + Number(x[2] || 0)).filter((v) => v >= 0 && v < 24 * 60);
  if (!m.length) return null;
  const debut = m[0], fin = m[1] > debut ? m[1] : Math.min(debut + 60, 24 * 60 - 1);
  return { debut, fin };
}

function editerDepense(id) {
  if (absente("depenses")) { toast("Le module Dépenses n’est pas encore activé (migration 017).", "erreur"); return; }
  const d = parId("depenses", id);
  formulaire({
    titre: d ? "Modifier la dépense" : "Nouvelle dépense", champs: champsDepense(),
    valeurs: d || { date: aujourdhui(), categorie: "autre", moyen: "avance_membre", statut: "a_rembourser", paye_par: moi()?.id },
    extra: `<div class="champ pleine" style="margin-top:14px"><label for="f_justif">Justificatif (photo du ticket ou facture)</label>${d?.justificatif_path ? `<small style="margin:0 0 6px">Actuel : ${esc(d.justificatif_nom || "fichier")}. Choisir un fichier le remplace.</small>` : ""}<input id="f_justif" name="justificatif" type="file" accept="image/*,application/pdf"><small>Garde toujours le ticket : sans justificatif, la comptabilité ne peut pas rembourser. 10 Mo maximum.</small></div>`,
    enregistrer: async (v, form) => {
      if (v.moyen !== "avance_membre") { v.paye_par = v.paye_par || null; if (v.statut === "a_rembourser") v.statut = "sans_objet"; }
      if (v.moyen === "avance_membre" && !v.paye_par) throw new Error("Indique qui a avancé l’argent, sinon personne ne saura qui rembourser.");
      if (v.statut === "rembourse" && !v.rembourse_le) v.rembourse_le = aujourdhui();
      if (v.statut !== "rembourse") v.rembourse_le = null;
      const f = form.elements.justificatif?.files?.[0];
      let ancien = null;
      if (f) {
        if (f.size > 10485760) throw new Error("Le justificatif dépasse 10 Mo.");
        const chemin = `depenses/${Date.now()}-${nomFichierSur(f.name)}`;
        const { error } = await sb.storage.from(CONFIG.bucket).upload(chemin, f, { contentType: f.type || undefined, upsert: false });
        if (error) throw error;
        ancien = d?.justificatif_path || null;
        v.justificatif_path = chemin; v.justificatif_nom = f.name;
      }
      await enregistrer("depenses", v, id);
      if (ancien) await sb.storage.from(CONFIG.bucket).remove([ancien]);
      toast("Dépense enregistrée.");
    },
    supprimer: d ? async () => { await supprimerLigne("depenses", id); if (d.justificatif_path) await sb.storage.from(CONFIG.bucket).remove([d.justificatif_path]); } : null,
    apresOuverture: (form) => {

        form.elements.paye_par.closest(".champ").hidden = !avance;
        form.elements.rembourse_le.closest(".champ").hidden = form.elements.statut.value !== "rembourse";
      };
      form.elements.moyen.addEventListener("change", () => { if (form.elements.moyen.value !== "avance_membre" && form.elements.statut.value === "a_rembourser") form.elements.statut.value = "sans_objet"; if (form.elements.moyen.value === "avance_membre" && form.elements.statut.value === "sans_objet") form.elements.statut.value = "a_rembourser"; maj(); });

      maj();
    },
  });
}

/* ---------- Wiki ---------- */
function mdEnLigne(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|#\/[^\s)]*)\)/g, (_, txt, url) => `<a href="${url}"${url.startsWith("#") ? "" : ' target="_blank" rel="noopener"'}>${txt}</a>`);
}
function markdown(src) {
  const out = []; let liste = null, para = [];
  const finPara = () => { if (para.length) { out.push(`<p>${para.map(mdEnLigne).join("<br>")}</p>`); para = []; } };
  const finListe = () => { if (liste) { out.push(`<${liste.type}>${liste.items.map((i) => `<li>${mdEnLigne(i)}</li>`).join("")}</${liste.type}>`); liste = null; } };
  for (const ligne of String(src || "").replace(/\r/g, "").split("\n")) {
    const l = ligne.trimEnd(); let m;
    if (!l.trim()) { finPara(); finListe(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { finPara(); finListe(); out.push(`<h${m[1].length}>${mdEnLigne(m[2])}</h${m[1].length}>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { finPara(); finListe(); out.push("<hr>"); continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { finPara(); finListe(); out.push(`<blockquote>${mdEnLigne(m[1])}</blockquote>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)$/)) || (m = l.match(/^\s*\d+[.)]\s+(.*)$/))) {
      finPara(); const type = /^\s*\d/.test(l) ? "ol" : "ul";
      if (!liste || liste.type !== type) { finListe(); liste = { type, items: [] }; }
      liste.items.push(m[1]); continue;
    }
    finListe(); para.push(l.trim());
  }
  finPara(); finListe();
  return out.join("");
}

/* ---------- Abonnement à l'agenda (lien personnel, mis à jour automatiquement) ---------- */
const lienAgenda = (jeton) => `${CONFIG.supabaseUrl}/functions/v1/agenda?jeton=${jeton}`;
async function jetonAgenda(renouveler) {
  const m = moi(); if (!m) throw new Error("Fiche membre introuvable.");
  if (renouveler) { const { error } = await sb.from("jetons_agenda").delete().eq("membre_id", m.id); if (error) throw error; }
  const { data, error } = await sb.from("jetons_agenda").select("jeton").eq("membre_id", m.id).maybeSingle();
  if (error) throw error;
  if (data) return data.jeton;
  const r = await sb.from("jetons_agenda").insert({ membre_id: m.id }).select("jeton").single();
  if (r.error) throw r.error;
  return r.data.jeton;
}
async function abonnerAgenda(renouveler) {
  try {
    const url = lienAgenda(await jetonAgenda(renouveler));
    const webcal = url.replace(/^https:/, "webcal:");
    fenetre("Synchroniser avec mon agenda", `
      <p class="petit">Ton lien personnel. Ton agenda y lit tes tâches (R ou A), tes réunions, tes relances clients, les mises en ligne et les objectifs, et se met à jour tout seul.</p>
      <div style="display:flex;gap:8px;margin:10px 0"><input readonly value="${esc(url)}" id="lien-agenda" style="flex:1;min-width:0" onclick="this.select()"><button class="btn primaire" data-action="copierLienAgenda">Copier</button></div>
      <p class="petit"><b>Google Agenda</b> (sur ordinateur) : Autres agendas, bouton +, « À partir de l’URL », colle le lien. Il apparaît aussi sur ton téléphone. Google rafraîchit lui-même, en général en quelques heures.</p>
      <p class="petit"><b>iPhone ou Mac</b> : <a href="${esc(webcal)}">ouvrir l’abonnement</a>, puis Valider.</p>
      <p class="petit"><b>Outlook</b> : Ajouter un calendrier, « S’abonner à partir du web », colle le lien.</p>
      <p class="petit muted">Ce lien est personnel : ne le partage pas. Il s’arrête tout seul si ton accès prend fin. En cas de doute, <button type="button" data-action="renouvelerLienAgenda" style="background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer">crée un nouveau lien</button> (l’ancien cesse de marcher, il faudra le remplacer dans ton agenda).</p>`);
  } catch (err) {
    if (["42P01", "PGRST205"].includes(err && err.code) || /jetons_agenda|schema cache|does not exist/i.test((err && err.message) || "")) toast("Module à activer : lancer la migration 008 dans Supabase et déployer la fonction « agenda ».", "erreur");
    else toast(msgErreur(err), "erreur");
  }
}
async function copierLienAgenda() {

/* ---------- Export de l'agenda (.ics) ---------- */
function exporterAgenda() {
  const auj = aujourdhui(), membre = filtres.agenda.moi && moi() ? moi().id : "";
  const ev = evenements(ajouterJours(auj, -30), ajouterJours(auj, 365), membre);
  if (!ev.length) { toast("Rien à exporter.", "erreur"); return; }
  const echap = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  const plier = (l) => { const o = []; let r = l; while (r.length > 73) { o.push(r.slice(0, 73)); r = " " + r.slice(73); } o.push(r); return o.join("\r\n"); };
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lignes = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NexusLab//Dashboard//FR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:NexusLab" + (membre ? " (" + echap(moi().nom) + ")" : "")];
  for (const e of ev) {
    const d = e.date.replace(/-/g, ""), fin = ajouterJours(e.date, 1).replace(/-/g, "");
    lignes.push("BEGIN:VEVENT", `UID:${e.type}-${e.id || slug(e.titre)}-${d}@nexus-lab.ch`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${fin}`,
      plier("SUMMARY:" + echap(TYPES_EVT[e.type][0] + " · " + e.titre)), plier("DESCRIPTION:" + echap(e.meta || "")), "TRANSP:TRANSPARENT", "END:VEVENT");
  }
  lignes.push("END:VCALENDAR");
  telecharger(membre ? `nexuslab-agenda-${slug(moi().nom)}.ics` : "nexuslab-agenda.ics", lignes.join("\r\n") + "\r\n", "text/calendar;charset=utf-8");
  toast(`${ev.length} élément${ev.length > 1 ? "s" : ""} exporté${ev.length > 1 ? "s" : ""}. Ouvre le fichier pour l’ajouter à ton agenda.`);
}

  const l = e.target.closest("[data-href]");
  if (l && !e.target.closest("a, button, input, select, label")) location.hash = l.dataset.href;
  if ($("#app").classList.contains("menu-ouvert") && !e.target.closest(".barre, [data-action=menu]")) $("#app").classList.remove("menu-ouvert");
});
// Ferme le menu « Créer » après un choix ou un clic ailleurs
document.addEventListener("click", (e) => { if (!$("#menu-creer").hidden && !e.target.closest("[data-action=menuCreer]")) basculerMenuCreer(false); }, true);
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("article.tache[data-action]")) { e.preventDefault(); ACTIONS.modifierTache(e.target.dataset); }
});
const LISTES = { situations: ["#liste-situations", listeSituations], wiki: ["#liste-wiki", listeWiki], reunions: ["#liste-reunions", listeReunions], ressources: ["#liste-ressources", listeRessources], clients: ["#liste-clients", listeClients], projets: ["#liste-projets", listeProjets], devis: ["#liste-devis", listeDevis], depenses: ["#liste-depenses", listeDepenses], taches: ["#liste-taches", listeTaches], documents: ["#liste-documents", listeDocuments] };
function majFiltre(el) {
  const [pg, cle] = el.dataset.filtre.split(".");
  filtres[pg][cle] = el.type === "checkbox" ? (el.checked ? "1" : "") : el.value;
  if (pg === "situations" && cle === "membre") { filtres.situations._init = true; rendre(); return; }
  const [sel, fn] = LISTES[pg];
  const cible = $(sel);
  if (cible) { cible.innerHTML = fn(); apresRendu(pg); }
}
document.addEventListener("input", (e) => { if (e.target.matches('input[type="search"][data-filtre]')) majFiltre(e.target); });
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.matches("select[data-filtre], input[type=checkbox][data-filtre]")) { majFiltre(el); return; }
  if (el.matches("select[data-maj]")) {
    try { await enregistrer(el.dataset.maj, { [el.dataset.champ]: el.value }, el.dataset.id); toast("Statut mis à jour."); rendre(); }
    catch (err) { toast(msgErreur(err), "erreur"); rendre(); }
  }
});

/* ==========================================================================
   Thème (jour / nuit)
   ========================================================================== */
function appliquerTheme(t, memoriser) {
  document.documentElement.dataset.theme = t;
  if (memoriser) ecrireStockage("nexus-theme", t);
  const nuit = t === "nuit";
  $("#btn-theme").innerHTML = icone(nuit ? "soleil" : "lune");
  $("#btn-theme").title = nuit ? "Passer en mode jour" : "Passer en mode nuit";
  $("#btn-theme").setAttribute("aria-label", $("#btn-theme").title);
}
appliquerTheme(lireStockage("nexus-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "nuit" : "jour"));

/* ==========================================================================
   Connexion et démarrage
   ========================================================================== */
function messageAuth(texte, type) { const m = $("#auth-message"); m.hidden = !texte; m.className = "message " + (type || "erreur"); m.textContent = texte || ""; }
function afficherConnexion(texte, type) {
  $("#app").hidden = true; $("#ecran-connexion").hidden = false;
  $("#form-connexion").hidden = false; $("#form-nouveau-mdp").hidden = true;
  $("#auth-titre").textContent = "Connexion";
  messageAuth(texte, type);
}
function afficherNouveauMdp() {
  $("#app").hidden = true; $("#ecran-connexion").hidden = false;
  $("#form-connexion").hidden = true; $("#form-nouveau-mdp").hidden = false;
  $("#auth-titre").textContent = "Choisir un mot de passe";
  $("#auth-sous-titre").textContent = "Bienvenue. Choisissez votre mot de passe (8 caractères minimum).";
  messageAuth("");
}
async function entrer() {
  $("#ecran-connexion").hidden = true; $("#app").hidden = false;
  $("#contenu").innerHTML = '<div class="chargement"><span class="pointille" aria-label="Chargement"></span></div>';
  try { await chargerTout(); }
  catch (err) { $("#contenu").innerHTML = `<div class="message erreur">Chargement impossible : ${esc(msgErreur(err))}</div>`; return; }
  const m = moi();
  if (!m) {
    messageSortie = `Le compte ${session?.user?.email || ""} n’a pas (ou plus) accès au dashboard NexusLab. Ta fiche dans Équipe doit porter exactement cette adresse e-mail, et ton accès ne doit pas être échu. Envoie cette adresse à un membre de l’équipe.`;
    await sb.auth.signOut();
    afficherConnexion(`Le compte ${session?.user?.email || ""} n’a pas (ou plus) accès au dashboard NexusLab. Ta fiche dans Équipe doit porter exactement cette adresse e-mail, et ton accès ne doit pas être échu. Envoie cette adresse à un membre de l’équipe.`);
    return;
  }
  $("#utilisateur").innerHTML = `${avatar(m.id, "")}<div style="min-width:0"><div class="nom">${esc(m.nom)}</div><div class="role">${esc(m.role || "")}</div></div>`;
  $("#raccourci-k").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";
  if (!location.hash || /access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname + "#/accueil");
  rendre();
}
$("#form-connexion").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) return;
  const btn = $('[type="submit"]', e.target); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.mdp.value });
  btn.disabled = false;
  if (error) messageAuth(msgErreur(error));
});
$("#btn-oubli").addEventListener("click", async () => {
  const email = $("#form-connexion").email.value.trim();
  if (!email) { messageAuth("Indiquez d’abord votre e-mail ci-dessus."); return; }
  let dernier = 0;
  try { dernier = Number(localStorage.getItem("nx-oubli") || 0); } catch { /* stockage indisponible */ }
  const attente = Math.ceil((dernier + 120000 - Date.now()) / 1000);
  if (attente > 0) { messageAuth(`Un e-mail vient déjà d’être demandé. Regarde ta boîte (et les spams) avant d’en redemander un, dans ${attente} s.`, "ok"); return; }
  const btn = $("#btn-oubli"); btn.disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  btn.disabled = false;
  if (!error) { try { localStorage.setItem("nx-oubli", String(Date.now())); } catch { /* stockage indisponible */ } }
  messageAuth(error ? msgErreur(error) : "Si ce compte existe, un e-mail vient d’être envoyé. Le lien ne marche qu’une fois : ouvre-le directement, sans le transférer.", error ? "erreur" : "ok");
});
$("#form-nouveau-mdp").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.mdp.value !== e.target.mdp2.value) { messageAuth("Les deux mots de passe ne sont pas identiques."); return; }
  const { error } = await sb.auth.updateUser({ password: e.target.mdp.value });
  if (error) { messageAuth(msgErreur(error)); return; }
  e.target.reset();
  history.replaceState(null, "", location.pathname + "#/accueil");
  await entrer();
});

let dejaEntre = false;
let messageSortie = "";
async function demarrer() {
  if (!sb) { afficherConnexion("La base de données n’est pas encore configurée (URL et clé Supabase manquantes)."); $("#form-connexion").hidden = true; return; }
  const modeMdp = /type=(invite|recovery)/.test(location.hash);
  const erreurLien = /error_description/.test(location.hash);
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((evt, s) => {
    session = s;
    if (evt === "PASSWORD_RECOVERY") { afficherNouveauMdp(); return; }
    if (evt === "SIGNED_OUT") { dejaEntre = false; Object.keys(db).forEach((k) => (db[k] = [])); afficherConnexion(messageSortie); messageSortie = ""; return; }
    if (evt === "SIGNED_IN" && !dejaEntre && $("#form-nouveau-mdp").hidden) { dejaEntre = true; setTimeout(entrer, 0); }
  });
  if (erreurLien && !session) { history.replaceState(null, "", location.pathname); afficherConnexion("Ce lien a expiré ou a déjà été utilisé. Utilisez « Mot de passe oublié ? » pour en recevoir un nouveau."); return; }
  if (session && modeMdp) { afficherNouveauMdp(); return; }
  if (session) { dejaEntre = true; await entrer(); } else afficherConnexion();
}
// Données fraîches quand on revient sur l'onglet après quelques minutes
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !session || !dejaEntre || dlg.open || Date.now() - dernierChargement < 120000) return;
  try { await chargerTout(); rendre(); } catch { /* hors ligne : on garde l'affichage */ }
});
demarrer();
</script>
