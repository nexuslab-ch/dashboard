<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>NexusLab, dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==========================================================================
   NexusLab, dashboard interne. Tout le style est ici.
   Couleurs centralisées dans les variables ci-dessous (mode jour et mode nuit).
   ========================================================================== */
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url("fonts/manrope-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url("fonts/manrope-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  --navy: #14213D; --navy-deep: #0D1730; --navy-soft: #1D2D52;
  --creme: #F6F2EC; --creme-2: #EFE9E0; --carte: #FFFDFA;
  --corail: #FF6B57; --corail-fonce: #B5402D; --corail-doux: #FFE9E4;
  --texte: #14213D; --texte-2: #4A5568; --texte-3: #6B7280;
  --ligne: #E4DDD2; --ligne-forte: #CFC6B8;
  --fond: var(--creme); --champ: #FFFFFF;
  --sur-navy: #F6F2EC; --sur-navy-2: #C9D1E0;
  --ombre: 0 1px 2px rgba(20,33,61,.05), 0 6px 20px rgba(20,33,61,.05);
  --rayon: 16px; --rayon-s: 10px;
  --t-gris: #4A5568;   --t-gris-bg: #EDEEF0;
  --t-bleu: #34548A;   --t-bleu-bg: #E7EDF7;
  --t-vert: #2F6544;   --t-vert-bg: #E4EFE7;
  --t-jaune: #80560A;  --t-jaune-bg: #FAF0DA;
  --t-violet: #5A4699; --t-violet-bg: #EEEAF8;
  --t-corail: #B5402D; --t-corail-bg: #FFE9E4;
  --t-rouge: #A3241A;  --t-rouge-bg: #FBE1DD;
  --barre: #FF6B57;
}
:root[data-theme="nuit"] {
  --fond: #0D1730; --carte: #16244A; --creme-2: #1A2950; --champ: #111D3D;
  --texte: #F6F2EC; --texte-2: #C9D1E0; --texte-3: #9AA6BF;
  --ligne: #26365E; --ligne-forte: #36497A;
  --ombre: 0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.2);
  --corail-doux: rgba(255,107,87,.16);
  --t-gris: #C9D1E0;   --t-gris-bg: rgba(201,209,224,.12);
  --t-bleu: #A9C1EC;   --t-bleu-bg: rgba(91,127,184,.22);
  --t-vert: #9FD0AE;   --t-vert-bg: rgba(110,156,126,.22);
  --t-jaune: #F2C670;  --t-jaune-bg: rgba(217,162,58,.2);
  --t-violet: #C6B8F0; --t-violet-bg: rgba(143,123,200,.24);
  --t-corail: #FFB0A3; --t-corail-bg: rgba(255,107,87,.2);
  --t-rouge: #FF9B8F;  --t-rouge-bg: rgba(218,41,28,.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Manrope", system-ui, sans-serif; background: var(--fond); color: var(--texte); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; line-height: 1.2; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.05rem; font-weight: 800; }
h3 { font-size: .95rem; font-weight: 700; }
[hidden] { display: none !important; }
.muted { color: var(--texte-3); }
.petit { font-size: .82rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--corail); outline-offset: 2px; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 11px; color: var(--sur-navy); text-decoration: none; }
.logo-mark { width: 42px; height: 19px; flex: none; }
.logo-mark .dot-a, .logo-mark .link { fill: currentColor; }
.logo-mark .dot-b { fill: var(--corail); }
.logo-word { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.035em; line-height: 1; }

/* ---------- Écrans de connexion ---------- */
.ecran-auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--navy); }
.carte-auth { width: 100%; max-width: 400px; background: var(--carte); color: var(--texte); border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.carte-auth .logo { color: var(--texte); margin-bottom: 18px; }
.carte-auth p.signature { color: var(--texte-2); margin: 0 0 22px; }
.carte-auth form { display: grid; gap: 14px; }
.carte-auth .lien { background: none; border: 0; padding: 0; color: var(--texte-2); text-decoration: underline; cursor: pointer; font-size: .88rem; justify-self: start; }
.message { padding: 10px 12px; border-radius: var(--rayon-s); font-size: .9rem; }
.message.erreur { background: var(--t-rouge-bg); color: var(--t-rouge); }
.message.ok { background: var(--t-vert-bg); color: var(--t-vert); }

/* ---------- Structure : barre latérale + contenu ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.barre { background: var(--navy); color: var(--sur-navy); display: flex; flex-direction: column; padding: 22px 14px; position: sticky; top: 0; height: 100vh; }
.barre .logo { padding: 0 10px 4px; }
.barre .sous-logo { color: var(--sur-navy-2); font-size: .78rem; padding: 0 10px; margin: 6px 0 22px; opacity: .8; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--sur-navy-2); font-weight: 600; font-size: .93rem; }
.nav a svg { width: 19px; height: 19px; flex: none; }
.nav a:hover { background: var(--navy-soft); color: var(--sur-navy); }
.nav a[aria-current="page"] { background: var(--navy-soft); color: #fff; box-shadow: inset 3px 0 0 var(--corail); }
.nav a .compteur { margin-left: auto; background: var(--corail); color: var(--navy); font-size: .72rem; font-weight: 800; border-radius: 99px; padding: 1px 7px; }
.barre-pied { margin-top: auto; border-top: 1px solid var(--navy-soft); padding-top: 14px; display: grid; gap: 8px; }
.utilisateur { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: .88rem; }
.utilisateur .avatar { width: 30px; height: 30px; }
.barre-pied .actions { display: flex; gap: 6px; padding: 0 4px; }
.barre-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid var(--navy-soft); color: var(--sur-navy-2); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: .82rem; font-weight: 600; }
.barre-btn:hover { background: var(--navy-soft); color: #fff; }
.barre-btn svg { width: 16px; height: 16px; }
.haut-mobile { display: none; }

main#contenu { padding: 32px 36px 64px; min-width: 0; max-width: 1400px; width: 100%; }
main#contenu:focus { outline: none; }
.app > div { min-width: 0; }
.entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.entete .sous-titre { color: var(--texte-2); margin-top: 6px; }
.entete .boutons { display: flex; gap: 8px; flex-wrap: wrap; }
.fil { font-size: .85rem; margin-bottom: 8px; }
.fil a { color: var(--texte-2); text-decoration: none; }
.fil a:hover { color: var(--corail-fonce); }

/* ---------- Boutons ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ligne-forte); background: var(--carte); color: var(--texte); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: .88rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--texte-3); }
.btn svg { width: 16px; height: 16px; }
.btn.primaire { background: var(--corail); border-color: var(--corail); color: var(--navy); }
.btn.primaire:hover { background: var(--corail-fonce); border-color: var(--corail-fonce); color: #fff; }
.btn.danger { color: var(--t-rouge); border-color: transparent; background: transparent; }
.btn.danger:hover { background: var(--t-rouge-bg); }
.btn.discret { border-color: transparent; background: transparent; color: var(--texte-2); padding: 6px 10px; }
.btn.discret:hover { background: var(--creme-2); color: var(--texte); }
.btn.mini { padding: 4px 9px; font-size: .8rem; border-radius: 8px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.large { width: 100%; justify-content: center; padding: 11px 14px; font-size: .95rem; }
.icone-btn { background: none; border: 0; cursor: pointer; color: var(--texte-2); font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.icone-btn:hover { background: var(--creme-2); color: var(--texte); }

/* ---------- Cartes et grilles ---------- */
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 20px 22px; box-shadow: var(--ombre); min-width: 0; }
.carte > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.carte.sans-marge { padding: 0; }
.carte.sans-marge > header { padding: 18px 22px 0; }
.grille { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-fiche { grid-template-columns: minmax(0,1fr) minmax(0,2fr); align-items: start; }
.pile { display: grid; gap: 18px; align-content: start; min-width: 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--carte); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 16px 18px; box-shadow: var(--ombre); text-decoration: none; display: block; }
.kpi:hover { border-color: var(--ligne-forte); }
.kpi .label { color: var(--texte-2); font-size: .82rem; font-weight: 600; }
.kpi .valeur { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .detail { font-size: .8rem; color: var(--texte-3); margin-top: 2px; }
.kpi.alerte .valeur { color: var(--corail-fonce); }
:root[data-theme="nuit"] .kpi.alerte .valeur { color: var(--corail); }

/* ---------- Badges, avatars ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.sans-point::before { display: none; }
.t-gris { color: var(--t-gris); background: var(--t-gris-bg); }
.t-bleu { color: var(--t-bleu); background: var(--t-bleu-bg); }
.t-vert { color: var(--t-vert); background: var(--t-vert-bg); }
.t-jaune { color: var(--t-jaune); background: var(--t-jaune-bg); }
.t-violet { color: var(--t-violet); background: var(--t-violet-bg); }
.t-corail { color: var(--t-corail); background: var(--t-corail-bg); }
.t-rouge { color: var(--t-rouge); background: var(--t-rouge-bg); }
.avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: .68rem; font-weight: 800; flex: none; letter-spacing: 0; }
.avatar.vide { background: var(--creme-2); color: var(--texte-3); }
.avatar.grand { width: 52px; height: 52px; font-size: 1.05rem; }
.raci { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; color: var(--texte-3); font-weight: 700; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; }
table.liste { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.liste th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--texte-3); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--ligne); white-space: nowrap; }
table.liste td { padding: 11px 14px; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
table.liste tr:last-child td { border-bottom: 0; }
table.liste tr[data-href] { cursor: pointer; }
table.liste tr[data-href]:hover td { background: var(--creme-2); }
table.liste td.fort { font-weight: 700; }
table.liste .num { text-align: right; }
.vide-liste { padding: 26px 22px; color: var(--texte-3); text-align: center; font-size: .92rem; }

/* ---------- Filtres ---------- */
.filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filtres input[type="search"], .filtres select { border: 1px solid var(--ligne-forte); background: var(--champ); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.filtres input[type="search"] { width: 260px; max-width: 100%; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { border: 1px solid var(--ligne-forte); background: var(--carte); border-radius: 99px; padding: 5px 12px; font-size: .82rem; font-weight: 700; cursor: pointer; color: var(--texte-2); }
.puce[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--sur-navy); }
:root[data-theme="nuit"] .puce[aria-pressed="true"] { background: var(--corail); border-color: var(--corail); color: var(--navy); }
.puce .n { opacity: .7; margin-left: 4px; }
.onglets { display: inline-flex; background: var(--creme-2); border-radius: 12px; padding: 3px; gap: 2px; }
.onglets button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--texte-2); }
.onglets button[aria-pressed="true"] { background: var(--carte); color: var(--texte); box-shadow: var(--ombre); }

/* ---------- Fiches (détails) ---------- */
dl.infos { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 9px 16px; margin: 0; font-size: .9rem; }
dl.infos dt { color: var(--texte-3); font-weight: 600; }
dl.infos dd { margin: 0; overflow-wrap: anywhere; }
dl.infos a { color: var(--texte); text-decoration-color: var(--corail); text-underline-offset: 3px; }
.statut-rapide { border: 1px solid var(--ligne-forte); background: var(--champ); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: .85rem; }
.texte-libre { white-space: pre-wrap; font-size: .9rem; color: var(--texte-2); margin: 0; }
.ligne-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--ligne); }
.ligne-item:last-child { border-bottom: 0; }
.ligne-item .corps { flex: 1; min-width: 0; }
.ligne-item .titre { font-weight: 700; font-size: .92rem; }
.ligne-item .meta { color: var(--texte-3); font-size: .8rem; }
.ligne-item.cliquable { cursor: pointer; }
.ligne-item.cliquable:hover .titre { color: var(--corail-fonce); }
:root[data-theme="nuit"] .ligne-item.cliquable:hover .titre { color: var(--corail); }
.ligne-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--corail); margin-top: 2px; }
.fait .titre { text-decoration: line-through; color: var(--texte-3); }
.retard { color: var(--t-rouge); font-weight: 700; }
.chrono { list-style: none; margin: 0; padding: 0; }
.chrono li { position: relative; padding: 0 0 14px 22px; font-size: .88rem; }
.chrono li::before { content: ""; position: absolute; left: 4px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--corail); }
.chrono li::after { content: ""; position: absolute; left: 7.5px; top: 18px; bottom: 0; width: 1px; background: var(--ligne); }
.chrono li:last-child::after { display: none; }
.chrono .quand { color: var(--texte-3); font-size: .78rem; }

/* ---------- Accueil ---------- */
.barres { display: grid; gap: 10px; }
.barre-ligne { display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 10px; font-size: .86rem; text-decoration: none; }
.barre-ligne .piste { height: 10px; background: var(--creme-2); border-radius: 99px; overflow: hidden; }
.barre-ligne .rempli { height: 100%; background: var(--barre); border-radius: 99px; min-width: 2px; }
.barre-ligne:hover .rempli { background: var(--corail-fonce); }

/* ---------- Offres ---------- */
.offres { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.offre { display: flex; flex-direction: column; gap: 10px; }
.offre .prix { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; }
.offre .prix small { font-size: .85rem; font-weight: 600; color: var(--texte-3); letter-spacing: 0; }
.offre ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .9rem; }
.offre li { display: flex; gap: 8px; }
.offre li::before { content: ""; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: var(--corail); flex: none; }
.offre.inactive { opacity: .6; }
.offre footer { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 8px; border-top: 1px solid var(--ligne); }

/* ---------- Tâches (tableau) ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.colonne { background: var(--creme-2); border-radius: var(--rayon); padding: 12px; min-height: 120px; }
.colonne > header { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 10px; }
.colonne.survol { outline: 2px dashed var(--corail); outline-offset: -2px; }
.cartes { display: grid; gap: 9px; }
.tache { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 11px 12px; cursor: pointer; display: grid; gap: 7px; box-shadow: var(--ombre); }
.tache:hover { border-color: var(--ligne-forte); }
.tache.glisse { opacity: .5; }
.tache .titre { font-weight: 700; font-size: .9rem; line-height: 1.35; }
.tache .projet { font-size: .77rem; color: var(--texte-3); }
.tache .bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .77rem; color: var(--texte-2); }
.tache .bas .droite { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.resume-heures { display: flex; gap: 18px; flex-wrap: wrap; font-size: .86rem; color: var(--texte-2); margin-bottom: 14px; }
.resume-heures strong { color: var(--texte); }

/* ---------- Équipe ---------- */
.membres { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; margin-bottom: 18px; }
.membre-tete { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--creme-2); border-radius: 10px; padding: 8px 10px; }
.stat .v { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .72rem; color: var(--texte-3); font-weight: 600; }
.charge { height: 8px; background: var(--creme-2); border-radius: 99px; overflow: hidden; }
.charge > div { height: 100%; background: var(--corail); border-radius: 99px; }

/* ---------- Documents ---------- */
.groupe-docs + .groupe-docs { margin-top: 18px; }
.groupe-docs h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sous-groupe { margin: 10px 0 0 0; }
.sous-groupe h4 { margin: 0 0 2px; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--texte-3); }
.icone-doc { width: 34px; height: 34px; border-radius: 9px; background: var(--corail-doux); color: var(--corail-fonce); display: grid; place-items: center; font-size: .66rem; font-weight: 800; flex: none; text-transform: uppercase; }
:root[data-theme="nuit"] .icone-doc { color: var(--corail); }

/* ---------- Formulaires ---------- */
.grille-form { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px 16px; }
.champ { display: grid; gap: 5px; min-width: 0; }
.champ.pleine { grid-column: 1 / -1; }
.champ label { font-size: .82rem; font-weight: 700; color: var(--texte-2); }
.champ .req { color: var(--corail-fonce); }
.champ small { color: var(--texte-3); font-size: .78rem; }
.champ input, .champ select, .champ textarea, .carte-auth input, .lignes input {

/* ---------- Fenêtre modale ---------- */

.espace { flex: 1; }
#confirmation { width: min(420px, calc(100vw - 32px)); }
#confirmation .corps { padding: 22px 22px 6px; }

/* Lignes de devis */
.lignes { width: 100%; border-collapse: collapse; margin-top: 4px; }
.lignes th { font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--texte-3); text-align: left; padding: 6px 4px; }

.lignes td.total { padding-top: 13px; font-weight: 700; }
.lignes .c-q { width: 90px; } .lignes .c-p { width: 130px; } .lignes .c-t { width: 120px; } .lignes .c-x { width: 36px; }
.totaux { display: grid; justify-content: end; gap: 4px; margin-top: 10px; font-size: .92rem; }
.totaux div { display: flex; gap: 24px; justify-content: space-between; min-width: 260px; }
.totaux .ttc { font-weight: 800; font-size: 1.05rem; border-top: 2px solid var(--corail); padding-top: 6px; margin-top: 4px; }
.separateur { grid-column: 1 / -1; border-top: 1px solid var(--ligne); margin: 4px 0; }

/* ---------- Notifications ---------- */
#toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 1000; }
.toast { background: var(--navy); color: var(--sur-navy); padding: 11px 16px; border-radius: 12px; font-size: .9rem; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 360px; border-left: 4px solid var(--corail); }
.toast.erreur { background: #7A1D14; border-left-color: #FFB0A3; }
.chargement { display: grid; place-items: center; min-height: 50vh; color: var(--texte-3); }
.pointille { display: inline-block; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ligne); border-top-color: var(--corail); animation: tourne .8s linear infinite; }

@media (prefers-reduced-motion: reduce) { .pointille { animation-duration: 3s; } }

/* ---------- Téléphone et tablette ---------- */

<script>

];

/* ---------- Petits outils ---------- */
const $ = (s, el = document) => el.querySelector(s);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function isoLocal(d = new Date()) { const z = d.getTimezoneOffset() * 60000; return new Date(d - z).toISOString().slice(0, 10); }

const vide = '<span class="muted">·</span>';

/* ---------- Libellés ---------- */

const libelle = (dict, v) => { const e = ETIQ[dict][v]; return Array.isArray(e) ? e[0] : (e || ""); };
const options = (dict, cles) => (cles || Object.keys(ETIQ[dict])).map((k) => [k, libelle(dict, k)]);
function badge(dict, v) { const e = ETIQ[dict][v]; return e ? `<span class="badge t-${e[1]}">${esc(e[0])}</span>` : ""; }

/* ---------- Icônes ---------- */
const ICONES = {
  accueil: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',

/* ==========================================================================
   Données : tout est chargé au démarrage (petite équipe, petits volumes).
   ========================================================================== */
const TABLES = {
  membres: { ordre: ["cree_le", true] },
  offres: { ordre: ["ordre", true] },
  clients: { ordre: ["nom", true] },
  projets: { ordre: ["cree_le", false] },
  devis_factures: { ordre: ["date_emission", false] },
  taches: { ordre: ["echeance", true] },
  documents: { ordre: ["date", false] },
  versions: { ordre: ["date", false] },
  retours: { ordre: ["date", false] },
  parametres: { ordre: ["id", true] },
};
const db = Object.fromEntries(Object.keys(TABLES).map((t) => [t, []]));
let session = null;
let dernierChargement = 0;

async function charger(table) {
  const [col, asc] = TABLES[table].ordre;
  const { data, error } = await sb.from(table).select("*").order(col, { ascending: asc, nullsFirst: false });
  if (error) throw error;
  db[table] = data;
}
async function chargerTout() { await Promise.all(Object.keys(TABLES).map(charger)); dernierChargement = Date.now(); }
async function enregistrer(table, valeurs, id) {
  const req = id ? sb.from(table).update(valeurs).eq("id", id) : sb.from(table).insert(valeurs);
  const { data, error } = await req.select().single();
  if (error) throw error;
  await charger(table);
  return data;
}
async function supprimerLigne(table, id) {
  const { error } = await sb.from(table).delete().eq("id", id);
  if (error) throw error;
  await charger(table);
}
function msgErreur(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (e && e.code === "23505") return "Cette valeur existe déjà (doublon).";
  if (e && e.code === "23503") return "Élément encore utilisé ailleurs.";
  if (e && (e.code === "42501" || /row-level security/i.test(m))) return "Accès refusé : votre compte n’est pas reconnu comme membre actif.";
  if (/Invalid login credentials/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Connexion impossible. Vérifiez internet et réessayez.";

}

const enRetard = (t) => t.echeance && t.statut !== "fait" && t.echeance < aujourdhui();

/* ==========================================================================

function toast(texte, type) {

function champHtml(c, v) {

  if (c.type === "checkbox") return `<label class="${cls} case"><input type="checkbox" name="${c.nom}"${v ? " checked" : ""}> <span>${esc(c.label)}</span></label>`;
  let input;
  if (c.type === "textarea") input = `<textarea id="${id}" name="${c.nom}" rows="${c.rows || 3}"${req}>${esc(v ?? "")}</textarea>`;
  else if (c.type === "liste") input = `<textarea id="${id}" name="${c.nom}" rows="${c.rows || 4}">${esc((v || []).join("\n"))}</textarea>`;
  else if (c.type === "select") {
    const vides = c.vide === false ? "" : `<option value="">${esc(c.vide || "Aucun")}</option>`;
    input = `<select id="${id}" name="${c.nom}"${req}>${vides}${c.options.map(([k, l]) => `<option value="${esc(k)}"${String(v ?? "") === String(k) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  } else {
    const extra = (c.step ? ` step="${c.step}"` : "") + (c.min != null ? ` min="${c.min}"` : "") + (c.placeholder ? ` placeholder="${esc(c.placeholder)}"` : "") + (c.liste ? ` list="${c.liste}"` : "") + (c.auto ? ` autocomplete="${c.auto}"` : "");
    input = `<input id="${id}" name="${c.nom}" type="${c.type || "text"}" value="${esc(v ?? "")}"${extra}${req}>`;
  }
  return `<div class="${cls}"><label for="${id}">${esc(c.label)}${c.requis ? ' <span class="req">*</span>' : ""}</label>${input}${c.aide ? `<small>${esc(c.aide)}</small>` : ""}</div>`;
}
function lireForm(form, champs) {
  const o = {};
  for (const c of champs) {
    if (c.type === "separateur" || c.lectureSeule) continue;
    const el = form.elements[c.nom];
    if (!el) continue;
    if (c.type === "checkbox") o[c.nom] = el.checked;
    else if (c.type === "number") o[c.nom] = el.value === "" ? (c.defaut ?? null) : Number(el.value);
    else if (c.type === "liste") o[c.nom] = el.value.split("\n").map((s) => s.trim()).filter(Boolean);
    else { const s = el.value.trim(); o[c.nom] = s === "" ? (c.defaut ?? null) : s; }
  }
  return o;
}
/* Ouvre une modale avec un formulaire généré à partir d'une liste de champs. */
function formulaire({ titre, champs, valeurs = {}, enregistrer: surEnregistrer, supprimer, large, texteBouton = "Enregistrer", extra = "", apresOuverture }) {
  dlg.className = large ? "large" : "";
  dlg.innerHTML = `<form class="modale-form" novalidate>
    <header><h2>${esc(titre)}</h2><button type="button" class="icone-btn" data-fermer aria-label="Fermer">×</button></header>
    <div class="corps"><div class="grille-form">${champs.map((c) => champHtml(c, valeurs[c.nom])).join("")}</div>${extra}</div>
    <footer>${supprimer ? '<button type="button" class="btn danger" data-suppr>Supprimer</button>' : ""}<span class="espace"></span>
      <button type="button" class="btn" data-fermer>Annuler</button><button type="submit" class="btn primaire">${esc(texteBouton)}</button></footer></form>`;
  const form = $("form", dlg);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = $('[type="submit"]', form);
    btn.disabled = true;
    try { await surEnregistrer(lireForm(form, champs), form); fermerModale(); rendre(); }
    catch (err) { toast(msgErreur(err), "erreur"); }
    finally { btn.disabled = false; }
  });
  if (supprimer) $("[data-suppr]", form).addEventListener("click", async () => {
    if (!(await confirmer("Supprimer définitivement cet élément ?"))) return;
    try { await supprimer(); fermerModale(); rendre(); toast("Supprimé."); }
    catch (err) { toast(msgErreur(err), "erreur"); }
  });
  dlg.showModal();
  if (apresOuverture) apresOuverture(form);
  const premier = $("input:not([type=checkbox]),select,textarea", form);
  if (premier) premier.focus();
}

function ficheClient(id) {

  <div class="grille g-fiche">
    <div class="pile">
      <section class="carte"><header><h2>Coordonnées</h2></header><dl class="infos">
        <dt>Contact</dt><dd>${esc(c.contact || "") || vide}</dd>
        <dt>E-mail</dt><dd>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : vide}</dd>
        <dt>Téléphone</dt><dd>${c.telephone ? `<a href="tel:${esc(c.telephone.replace(/\s/g, ""))}">${esc(c.telephone)}</a>` : vide}</dd>
        <dt>Adresse</dt><dd>${esc(adresse) || vide}</dd>
        <dt>Source</dt><dd>${esc(c.source || "") || vide}</dd>
        <dt>Suivi depuis</dt><dd>${dateFr(c.cree_le)}</dd></dl></section>
      <section class="carte"><header><h2>Notes</h2></header>${c.notes ? `<p class="texte-libre">${esc(c.notes)}</p>` : '<p class="muted petit" style="margin:0">Pas de note.</p>'}</section>
      <section class="carte"><header><h2>Historique</h2></header><ul class="chrono">${evts.slice(0, 25).map((e) => `<li><div>${esc(e.t)}</div><div class="quand">${dateFr(e.q)}</div></li>`).join("")}</ul></section>
    </div>
    <div class="pile">
      <section class="carte"><header><h2>Sites</h2><button class="btn mini" data-action="nouveauProjet" data-client="${c.id}">${icone("plus")}Site</button></header>
        ${projets.length ? projets.map((p) => `<div class="ligne-item cliquable" data-href="#/projets/${p.id}"><div class="corps"><div class="titre">${esc(p.nom)} ${p.version ? `<span class="muted petit">${esc(p.version)}</span>` : ""}</div><div class="meta">${esc(p.prochaine_etape || libelle("typeProjet", p.type))}</div></div>${badge("statutProjet", p.statut)}</div>`).join("") : '<div class="vide-liste">Aucun site pour ce client.</div>'}</section>

function listeDevis() {
  const f = filtres.devis, q = f.q.toLowerCase();
  const l = db.devis_factures.filter((d) => (!f.type || d.type === f.type) && (!f.statut || d.statut === f.statut) && (!q || [d.numero, nomClient(d.client_id), d.objet].join(" ").toLowerCase().includes(q)));
  const total = l.filter((d) => d.statut !== "annule").reduce((s, d) => s + Number(d.montant_ttc || 0), 0);
  return `<div style="padding:8px 8px 6px">${tableDf(l, true)}</div>${l.length ? `<div class="petit muted" style="padding:0 22px 14px;text-align:right">${l.length} élément${l.length > 1 ? "s" : ""} · total hors annulés ${chf(total)}</div>` : ""}`;
}

function nouvelleLigneHtml(l = {}) {
  return `<tr><td><input data-l="description" value="${esc(l.description || "")}" placeholder="Prestation" aria-label="Description"></td>
    <td class="c-q"><input data-l="quantite" type="number" step="0.25" min="0" value="${l.quantite ?? 1}" aria-label="Quantité"></td>
    <td class="c-p"><input data-l="prix" type="number" step="0.05" value="${l.prix ?? 0}" aria-label="Prix unitaire"></td>
    <td class="c-t num total"></td><td class="c-x"><button type="button" class="icone-btn" data-suppr-ligne aria-label="Retirer la ligne">×</button></td></tr>`;
}
function editeurDf(id, defauts = {}) {
  const p = parametres();
  const ex = parId("devis_factures", id);
  const type = ex ? ex.type : defauts.type || "devis";
  const d = ex ? { ...ex } : {
    type, client_id: defauts.client_id || null, projet_id: defauts.projet_id || null, objet: "",
    lignes: [{ description: "", quantite: 1, prix: 0 }], taux_tva: Number(p.taux_tva_defaut || 0), statut: "brouillon",
    date_emission: aujourdhui(), echeance: ajouterJours(aujourdhui(), type === "facture" ? p.delai_paiement_jours || 30 : p.validite_devis_jours || 30),
  };
  const champs = [
    { nom: "client_id", label: "Client", type: "select", options: optClients(), requis: true, vide: "Choisir un client" },
    { nom: "projet_id", label: "Site lié", type: "select", options: optProjets() },
    { nom: "objet", label: "Objet", pleine: true, placeholder: type === "devis" ? "Création du site vitrine" : "Création du site vitrine, solde" },
    { nom: "date_emission", label: "Date", type: "date", requis: true },
    { nom: "echeance", label: type === "facture" ? "Échéance de paiement" : "Valable jusqu’au", type: "date" },
    { nom: "statut", label: "Statut", type: "select", options: options("statutDf", STATUTS_DF_PAR_TYPE[type]), vide: false, defaut: "brouillon" },
    { nom: "taux_tva", label: "TVA (%)", type: "number", step: "0.1", min: 0, defaut: 0, aide: Number(p.taux_tva_defaut) ? "" : "0 tant que NexusLab n’est pas assujetti." },
    ...(type === "facture" ? [{ nom: "date_paiement", label: "Payée le", type: "date" }] : []),
    { nom: "notes", label: "Remarques (imprimées sur le PDF)", type: "textarea", pleine: true, rows: 2 },
  ];
  const lignes = Array.isArray(d.lignes) && d.lignes.length ? d.lignes : [{ description: "", quantite: 1, prix: 0 }];
  const extra = `<h3 style="margin:18px 0 4px">Prestations</h3>
    <div class="table-wrap"><table class="lignes"><thead><tr><th>Description</th><th class="c-q">Quantité</th><th class="c-p">Prix unitaire</th><th class="c-t num">Total</th><th class="c-x"></th></tr></thead><tbody id="lignes-corps">${lignes.map(nouvelleLigneHtml).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button type="button" class="btn mini" id="ajout-ligne">${icone("plus")}Ligne</button>
      <select id="ajout-offre" class="statut-rapide" aria-label="Ajouter une offre"><option value="">Ajouter une offre...</option>${db.offres.filter((o) => o.active).map((o) => `<option value="${o.id}">${esc(o.nom)} (${chfCourt(o.prix_depart)})</option>`).join("")}</select></div>
    <div class="totaux" id="totaux"></div>`;
  const titre = ex ? `${type === "devis" ? "Devis" : "Facture"} ${ex.numero}` : type === "devis" ? "Nouveau devis" : "Nouvelle facture";
  let pdfApres = false;

  formulaire({
    titre, champs, valeurs: d, extra, large: true,
    enregistrer: async (v, form) => {
      const avecPdf = pdfApres; pdfApres = false;
      const lg = $$("#lignes-corps tr", form).map((tr) => ({
        description: $('[data-l="description"]', tr).value.trim(),
        quantite: Number($('[data-l="quantite"]', tr).value) || 0,
        prix: Number($('[data-l="prix"]', tr).value) || 0,
      })).filter((l) => l.description || l.prix);
      if (!lg.length) throw new Error("Ajoutez au moins une prestation.");
      v.lignes = lg;
      v.montant_ht = arrondi(lg.reduce((s, l) => s + arrondi(l.quantite * l.prix), 0));
      if (v.statut === "paye" && !v.date_paiement) v.date_paiement = aujourdhui();
      let r;
      if (ex) r = await enregistrer("devis_factures", v, id);
      else {
        const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: type });
        if (error) throw error;
        r = await enregistrer("devis_factures", { ...v, type, numero });
      }
      toast(`${type === "devis" ? "Devis" : "Facture"} ${r.numero} enregistré${type === "facture" ? "e" : ""}.`);
      if (avecPdf) await telechargerPdf(r.id);
    },
    supprimer: ex ? () => supprimerLigne("devis_factures", id) : null,
    apresOuverture: (form) => {
      const corps = $("#lignes-corps", form);
      const recalcul = () => {
        let ht = 0;
        for (const tr of $$("tr", corps)) {
          const t = arrondi((Number($('[data-l="quantite"]', tr).value) || 0) * (Number($('[data-l="prix"]', tr).value) || 0));
          ht += t; $(".total", tr).textContent = fmtNombre.format(t);
        }
        ht = arrondi(ht);
        const taux = Number(form.elements.taux_tva.value) || 0, tva = arrondi((ht * taux) / 100);
        $("#totaux", form).innerHTML = `<div><span>Sous-total HT</span><span class="num">${chf(ht)}</span></div>${taux ? `<div><span>TVA ${taux} %</span><span class="num">${chf(tva)}</span></div>` : ""}<div class="ttc"><span>Total</span><span class="num">${chf(ht + tva)}</span></div>`;
      };
      form.addEventListener("input", recalcul);
      corps.addEventListener("click", (e) => { if (e.target.closest("[data-suppr-ligne]")) { e.target.closest("tr").remove(); if (!$("tr", corps)) corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); recalcul(); } });
      $("#ajout-ligne", form).addEventListener("click", () => { corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); $("tr:last-child input", corps).focus(); recalcul(); });
      $("#ajout-offre", form).addEventListener("change", (e) => {
        const o = parId("offres", e.target.value); e.target.value = "";
        if (!o) return;
        const premiere = $("tr", corps);
        if (corps.children.length === 1 && premiere && !$('[data-l="description"]', premiere).value) premiere.remove();
        corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml({ description: `Offre ${o.nom}${o.periode !== "unique" ? " (" + libelle("periode", o.periode).toLowerCase() + ")" : ""}`, quantite: 1, prix: Number(o.prix_depart || 0) }));
        if (!form.elements.objet.value) form.elements.objet.value = "Offre " + o.nom;
        recalcul();
      });
      form.elements.projet_id.addEventListener("change", (e) => { const pr = parId("projets", e.target.value); if (pr?.client_id && !form.elements.client_id.value) form.elements.client_id.value = pr.client_id; });
      recalcul();
      // Boutons supplémentaires : PDF, transformer en facture, payée
      const pied = $("footer", form), envoi = $('[type="submit"]', pied);
      const bPdf = document.createElement("button");
      bPdf.type = "button"; bPdf.className = "btn"; bPdf.innerHTML = icone("pdf") + "Enregistrer et PDF";
      bPdf.addEventListener("click", () => { pdfApres = true; form.requestSubmit(envoi); });
      envoi.addEventListener("click", () => (pdfApres = false));
      pied.insertBefore(bPdf, envoi);
      if (ex && ex.type === "devis" && ["envoye", "accepte"].includes(ex.statut)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Transformer en facture";
        b.addEventListener("click", () => facturerDevis(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
      if (ex && ex.type === "facture" && ex.statut === "envoye") {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Marquer payée";
        b.addEventListener("click", () => marquerPayee(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
    },
  });
}
async function facturerDevis(id) {
  const d = parId("devis_factures", id);
  if (!d || !(await confirmer(`Créer une facture à partir du devis ${d.numero} ?`, "Créer la facture"))) return;
  try {
    const p = parametres();
    const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: "facture" });
    if (error) throw error;
    const f = await enregistrer("devis_factures", {
      type: "facture", numero, client_id: d.client_id, projet_id: d.projet_id, objet: d.objet, lignes: d.lignes,
      montant_ht: d.montant_ht, taux_tva: d.taux_tva, statut: "brouillon", date_emission: aujourdhui(),
      echeance: ajouterJours(aujourdhui(), p.delai_paiement_jours || 30), devis_origine_id: d.id, notes: d.notes,
    });
    await enregistrer("devis_factures", { statut: "facture" }, d.id);
    const c = parId("clients", d.client_id);
    if (c && ["prospect", "contacte", "rendez_vous", "offre_envoyee"].includes(c.statut)) await enregistrer("clients", { statut: "mandat_signe" }, c.id);
    fermerModale(); rendre(); toast(`Facture ${f.numero} créée.`);
    editeurDf(f.id);
  } catch (err) { toast(msgErreur(err), "erreur"); }
}
async function marquerPayee(id) {
  try { await enregistrer("devis_factures", { statut: "paye", date_paiement: aujourdhui() }, id); fermerModale(); rendre(); toast("Facture marquée payée."); }
  catch (err) { toast(msgErreur(err), "erreur"); }
}

function pageTaches() {
  const f = filtres.taches;
  return `
  <div class="entete"><div><h1>Tâches</h1><div class="sous-titre">R : responsable, celui qui fait · A : valideur, celui qui valide</div></div>
    <div class="boutons"><button class="btn primaire" data-action="nouvelleTache">${icone("plus")}Nouvelle tâche</button></div></div>
  <div class="filtres">
    <div class="onglets" role="group" aria-label="Vue">${[["statut", "Par statut"], ["personne", "Par personne"], ["sprint", "Par sprint"]].map(([k, l]) => `<button aria-pressed="${f.vue === k}" data-action="puce" data-filtre="taches.vue" data-valeur="${k}">${l}</button>`).join("")}</div>
    <select data-filtre="taches.sprint" aria-label="Sprint"><option value="">Tous les sprints</option>${sprints().map((s) => `<option${f.sprint === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <select data-filtre="taches.personne" aria-label="Personne"><option value="">Toute l’équipe</option>${db.membres.map((m) => `<option value="${m.id}"${f.personne === m.id ? " selected" : ""}>${esc(m.nom)}</option>`).join("")}</select>
    <select data-filtre="taches.projet" aria-label="Site"><option value="">Tous les sites</option>${db.projets.map((p) => `<option value="${p.id}"${f.projet === p.id ? " selected" : ""}>${esc(p.nom)}</option>`).join("")}</select>
    <label class="petit" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-filtre="taches.fait" ${f.fait === "1" ? "checked" : ""}> Afficher les tâches faites</label>
  </div>
  <div id="liste-taches">${listeTaches()}</div>`;
}
function tachesFiltrees() {
  const f = filtres.taches;
  return db.taches.filter((t) => (!f.sprint || t.sprint === f.sprint) && (!f.projet || t.projet_id === f.projet)
    && (!f.personne || t.responsable_id === f.personne || t.valideur_id === f.personne) && (f.fait === "1" || t.statut !== "fait"));
}
function carteTache(t) {
  const h = t.heures_estimees != null || t.heures_reelles != null ? `<span title="Heures réelles / estimées">${(Number(t.heures_reelles) || 0).toLocaleString("fr-CH")} / ${(Number(t.heures_estimees) || 0).toLocaleString("fr-CH")} h</span>` : "";
  return `<article class="tache" draggable="true" data-id="${t.id}" data-action="modifierTache" tabindex="0">
    ${t.projet_id ? `<div class="projet">${esc(nomProjet(t.projet_id))}</div>` : ""}
    <div class="titre">${esc(t.titre)}</div>
    <div class="bas"><span class="raci">R ${avatar(t.responsable_id, "Responsable (R)")}</span><span class="raci">A ${avatar(t.valideur_id, "Valideur (A)")}</span>
      <span class="droite">${h}${t.echeance ? `<span class="${enRetard(t) ? "retard" : ""}">${dateCourte(t.echeance)}</span>` : ""}</span></div>
    ${filtres.taches.vue !== "statut" ? `<div>${badge("statutTache", t.statut)}${t.sprint && filtres.taches.vue !== "sprint" ? ` <span class="muted petit">${esc(t.sprint)}</span>` : ""}</div>` : t.sprint ? `<div class="muted petit">${esc(t.sprint)}</div>` : ""}
  </article>`;
}
function listeTaches() {
  const f = filtres.taches, l = tachesFiltrees();
  const est = l.reduce((s, t) => s + Number(t.heures_estimees || 0), 0), reel = l.reduce((s, t) => s + Number(t.heures_reelles || 0), 0);
  let cols;
  if (f.vue === "personne") cols = [...membresActifs().map((m) => [m.id, m.nom, l.filter((t) => t.responsable_id === m.id)]), ["", "Non attribuées", l.filter((t) => !parId("membres", t.responsable_id))]].filter((c) => c[0] !== "" || c[2].length);
  else if (f.vue === "sprint") { const s = sprints().filter((x) => !f.sprint || x === f.sprint); cols = [...s.map((x) => [x, x, l.filter((t) => t.sprint === x)]), ["", "Sans sprint", l.filter((t) => !t.sprint)]].filter((c) => c[0] !== "" || c[2].length); }
  else cols = Object.keys(ETIQ.statutTache).filter((k) => k !== "fait" || f.fait === "1").map((k) => [k, libelle("statutTache", k), l.filter((t) => t.statut === k)]);
  return `<div class="resume-heures"><span><strong>${l.filter((t) => t.statut !== "fait").length}</strong> ouvertes</span><span><strong>${l.filter(enRetard).length}</strong> en retard</span><span>Heures estimées <strong>${heures(est)}</strong></span><span>Heures réelles <strong>${heures(reel)}</strong></span></div>
  <div class="kanban">${cols.map(([k, titre, ts]) => `<section class="colonne"${f.vue === "statut" ? ` data-statut="${k}"` : ""}><header><h3>${esc(titre)}</h3><span class="muted petit">${ts.length}</span></header><div class="cartes">${ts.map(carteTache).join("") || '<div class="muted petit" style="padding:8px 4px">Rien ici.</div>'}</div></section>`).join("")}</div>`;
}
function brancherGlisser() {
  if (filtres.taches.vue !== "statut") return;
  let glisse = null;
  for (const c of $$(".tache")) {
    c.addEventListener("dragstart", (e) => { glisse = c.dataset.id; c.classList.add("glisse"); e.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => c.classList.remove("glisse"));
  }
  for (const col of $$(".colonne[data-statut]")) {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("survol"); });
    col.addEventListener("dragleave", () => col.classList.remove("survol"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("survol");
      const t = parId("taches", glisse);
      if (!t || t.statut === col.dataset.statut) return;
      try { await enregistrer("taches", { statut: col.dataset.statut }, t.id); rendre(); }
      catch (err) { toast(msgErreur(err), "erreur"); }
    });
  }
}

   Équipe
   ========================================================================== */
function pageEquipe() {
  const auj = aujourdhui();
  const charges = db.membres.map((m) => db.taches.filter((t) => t.responsable_id === m.id && t.statut !== "fait").reduce((s, t) => s + Math.max(0, Number(t.heures_estimees || 0) - Number(t.heures_reelles || 0)), 0));
  const maxCharge = Math.max(1, ...charges);
  const sp = sprints();
  const actifs = membresActifs();
  return `
  <div class="entete"><div><h1>Équipe</h1><div class="sous-titre">Rôles, charge de travail et heures</div></div>
    <div class="boutons"><button class="btn" data-action="nouveauMembre">${icone("plus")}Membre</button></div></div>
  <div class="membres">${db.membres.map((m, i) => {
    const r = db.taches.filter((t) => t.responsable_id === m.id);
    const ouvertes = r.filter((t) => t.statut !== "fait");
    const aValider = db.taches.filter((t) => t.valideur_id === m.id && t.statut === "a_valider");
    const retard = ouvertes.filter((t) => t.echeance && t.echeance < auj);
    const reel = r.reduce((s, t) => s + Number(t.heures_reelles || 0), 0);
    const projets = db.projets.filter((p) => p.responsable_id === m.id && p.statut !== "termine");
    return `<article class="carte${m.actif ? "" : " offre inactive"}">
      <div class="membre-tete">${avatar(m.id, "", true)}<div style="flex:1;min-width:0"><h2>${esc(m.nom)}</h2><div class="muted petit">${esc(m.role || "")}</div></div><button class="btn discret mini" data-action="modifierMembre" data-id="${m.id}" aria-label="Modifier ${esc(m.nom)}">${icone("crayon")}</button></div>
      <div class="petit muted">${m.email ? esc(m.email) : '<span class="retard">E-mail de connexion manquant</span>'}${m.actif ? "" : " · inactif"}</div>
      <div class="stats"><div class="stat"><div class="v">${ouvertes.length}</div><div class="l">Tâches (R)</div></div><div class="stat"><div class="v">${aValider.length}</div><div class="l">À valider (A)</div></div><div class="stat"><div class="v${retard.length ? " retard" : ""}">${retard.length}</div><div class="l">En retard</div></div></div>
      <div class="petit" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Charge restante</span><strong>${heures(charges[i])}</strong></div>
      <div class="charge"><div style="width:${(charges[i] / maxCharge) * 100}%"></div></div>
      <div class="petit muted" style="margin-top:10px">${heures(reel)} réalisées au total${projets.length ? " · responsable de " + projets.map((p) => esc(p.nom)).join(", ") : ""}</div>
    </article>`;
  }).join("")}</div>
  <section class="carte sans-marge"><header><h2>Heures par sprint</h2><span class="muted petit">réelles / estimées</span></header>
    ${sp.length ? `<div class="table-wrap" style="padding:8px 8px 6px"><table class="liste"><thead><tr><th>Sprint</th>${actifs.map((m) => `<th class="num">${esc(m.nom)}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>
      ${sp.map((s) => { const ts = db.taches.filter((t) => t.sprint === s); const cell = (l) => `${heures(l.reduce((a, t) => a + Number(t.heures_reelles || 0), 0))} / ${heures(l.reduce((a, t) => a + Number(t.heures_estimees || 0), 0))}`;
        return `<tr><td class="fort">${esc(s)}</td>${actifs.map((m) => `<td class="num">${cell(ts.filter((t) => t.responsable_id === m.id))}</td>`).join("")}<td class="num fort">${cell(ts)}</td></tr>`; }).join("")}
    </tbody></table></div>` : '<div class="vide-liste">Les heures apparaîtront ici dès que des tâches auront un sprint.</div>'}
  </section>`;
}

function pageDocuments() {
  const f = filtres.documents;
  return `
  <div class="entete"><div><h1>Documents</h1><div class="sous-titre">Fichiers classés par client et par site</div></div>
    <div class="boutons"><button class="btn primaire" data-action="ajouterDocument">${icone("plus")}Ajouter des fichiers</button></div></div>
  <div class="filtres">
    <input type="search" placeholder="Nom du fichier" value="${esc(f.q)}" data-filtre="documents.q" aria-label="Rechercher">
    <select data-filtre="documents.client" aria-label="Client"><option value="">Tous les clients</option>${db.clients.map((c) => `<option value="${c.id}"${f.client === c.id ? " selected" : ""}>${esc(c.nom)}</option>`).join("")}</select>
    <select data-filtre="documents.projet" aria-label="Site"><option value="">Tous les sites</option>${db.projets.map((p) => `<option value="${p.id}"${f.projet === p.id ? " selected" : ""}>${esc(p.nom)}</option>`).join("")}</select>
    <select data-filtre="documents.type" aria-label="Type"><option value="">Tous les types</option>${options("typeDoc").map(([k, l]) => `<option value="${k}"${f.type === k ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>
  </div>
  <div id="liste-documents">${listeDocuments()}</div>`;
}
function listeDocuments() {
  const f = filtres.documents, q = f.q.toLowerCase();
  const l = db.documents.filter((d) => (!q || d.nom.toLowerCase().includes(q)) && (!f.client || d.client_id === f.client) && (!f.projet || d.projet_id === f.projet) && (!f.type || d.type === f.type));
  if (!l.length) return '<div class="carte vide-liste">Aucun document. Ajoutez des contrats, maquettes, logos ou photos.</div>';
  const groupes = new Map();
  for (const d of l) { const k = d.client_id || ""; if (!groupes.has(k)) groupes.set(k, []); groupes.get(k).push(d); }
  return [...groupes.entries()].sort((a, b) => (nomClient(a[0]) || "zzz").localeCompare(nomClient(b[0]) || "zzz", "fr")).map(([cid, docs]) => {
    const parProjet = new Map();

function ibanValide(i) {

function chargerScript(src) {

function pdfTexte(s) {

    .replace(/[^\x20-\x7E\xA0-\xFF‘’“”…€Œœ]/g, "");
}
function couper(texte, police, taille, largeur) {
  const lignes = [];
  for (const para of String(texte ?? "").split(/\n/)) {
    const mots = pdfTexte(para).split(" ");
    let l = "";
    for (const m of mots) {
      const essai = l ? l + " " + m : m;
      if (police.widthOfTextAtSize(essai, taille) <= largeur || !l) l = essai; else { lignes.push(l); l = m; }
    }
    lignes.push(l);
  }
  return lignes;

function referenceQrr(numero) {

  const table = [0, 9, 4, 6, 8, 2, 7, 1, 3, 5];

  for (const ch of base) report = table[(report + Number(ch)) % 10];
  return base + ((10 - report) % 10);

  T("CHF", x, mm(29), f, 8); T(montantQr(d.montant_ttc), x + mm(13), mm(29), f, 8);
  const depot = "Point de dépôt";
  T(depot, mm(57) - fb.widthOfTextAtSize(depot, 6), mm(19), fb, 6);

  // Section paiement (droite)
  x = mm(67); y = haut - mm(5) - 11;
  T("Section paiement", x, y, fb, 11);
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M"); qr.addData(donnees, "Byte"); qr.make();
  const n = qr.getModuleCount(), taille = mm(46), cell = taille / n, qx = mm(67), qy = mm(42);
  // Un seul tracé, modules sombres regroupés par ligne et légèrement chevauchants : pas de joints blancs
  let chemin = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (!qr.isDark(r, c)) continue;
    let fin = c; while (fin + 1 < n && qr.isDark(r, fin + 1)) fin++;
    chemin += `M${c} ${r - 0.03}H${fin + 1}V${r + 1.03}H${c}Z`;
    c = fin;
  }
  page.drawSvgPath(chemin, { x: qx, y: qy + taille, scale: cell, color: C.noir, borderWidth: 0 });
  // Croix suisse au centre
  const cx = qx + taille / 2, cy = qy + taille / 2;
  page.drawRectangle({ x: cx - mm(3.5), y: cy - mm(3.5), width: mm(7), height: mm(7), color: C.blanc });
  page.drawRectangle({ x: cx - mm(3.05), y: cy - mm(3.05), width: mm(6.1), height: mm(6.1), color: C.noir });
  page.drawRectangle({ x: cx - mm(1.95), y: cy - mm(0.6), width: mm(3.9), height: mm(1.2), color: C.blanc });
  page.drawRectangle({ x: cx - mm(0.6), y: cy - mm(1.95), width: mm(1.2), height: mm(3.9), color: C.blanc });
  T("Monnaie", x, mm(33), fb, 8); T("Montant", x + mm(14), mm(33), fb, 8);
  T("CHF", x, mm(28.5), f, 10); T(montantQr(d.montant_ttc), x + mm(14), mm(28.5), f, 10);

  x = mm(118); y = haut - mm(5) - 8;
  T("Compte / Payable à", x, y, fb, 8); y -= 11;
  for (const l of creancier) { T(l, x, y, f, 10); y -= 11; }
  if (reference) { y -= 5; T("Référence", x, y, fb, 8); y -= 11; T(groupeRef(reference), x, y, f, 10); y -= 11; }
  y -= 5; T("Informations supplémentaires", x, y, fb, 8); y -= 11;
  for (const l of couper(message, f, 10, mm(87)).slice(0, 2)) { T(l, x, y, f, 10); y -= 11; }
  y -= 5; T("Payable par", x, y, fb, 8); y -= 11;
  if (debiteur) for (const l of debiteur) { T(l, x, y, f, 10); y -= 11; }
  else cadre(x, y - mm(25) + 8, mm(65), mm(25));
}

async function telechargerPdf(id) {
  const d = parId("devis_factures", id);
  if (!d) return;
  toast("Préparation du PDF...");
  try {
    const octets = await genererPdf(d);
    const blob = new Blob([octets], { type: "application/pdf" });
    const nom = `${d.numero} ${nomClient(d.client_id)}`.trim();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nomFichierSur(nom) + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    // Archive dans la GED (classé par client et par site)
    const chemin = `${d.client_id || "sans-client"}/${d.projet_id || "general"}/${nomFichierSur(d.numero)}.pdf`;
    const { error } = await sb.storage.from(CONFIG.bucket).upload(chemin, blob, { contentType: "application/pdf", upsert: true });
    if (error) throw error;
    const { error: e2 } = await sb.from("documents").upsert({ client_id: d.client_id, projet_id: d.projet_id, nom: `${d.numero}.pdf`, type: d.type, fichier_path: chemin, taille: blob.size, mime: "application/pdf", date: aujourdhui() }, { onConflict: "fichier_path" });
    if (e2) throw e2;
    if (d.pdf_path !== chemin) await enregistrer("devis_factures", { pdf_path: chemin }, d.id);
    await charger("documents");
    rendre();
  } catch (err) { console.error(err); toast("PDF : " + msgErreur(err), "erreur"); }
}

/* ==========================================================================
   Actions (boutons) et filtres : délégation d'événements
   ========================================================================== */
const ACTIONS = {
  nouveauClient: () => editerClient(),
  modifierClient: (ds) => editerClient(ds.id),
  filtrerClients: (ds) => { filtres.clients.statut = ds.statut; location.hash = "#/clients"; },
  nouveauProjet: (ds) => editerProjet(null, { client_id: ds.client || null }),
  modifierProjet: (ds) => editerProjet(ds.id),
  nouvelleOffre: () => editerOffre(),
  modifierOffre: (ds) => editerOffre(ds.id),
  basculerOffre: async (ds) => { const o = parId("offres", ds.id); try { await enregistrer("offres", { active: !o.active }, o.id); rendre(); } catch (err) { toast(msgErreur(err), "erreur"); } },
  nouveauDf: (ds) => editeurDf(null, { type: ds.type, client_id: ds.client || null, projet_id: ds.projet || null }),
  modifierDf: (ds) => editeurDf(ds.id),
  pdfDf: (ds) => telechargerPdf(ds.id),
  nouvelleTache: (ds) => editerTache(null, { projet_id: ds.projet || null }),
  modifierTache: (ds) => editerTache(ds.id),
  filtrerTachesMoi: () => { if (moi()) filtres.taches.personne = moi().id; location.hash = "#/taches"; },
  nouveauMembre: () => editerMembre(),
  modifierMembre: (ds) => editerMembre(ds.id),
  nouvelleVersion: (ds) => editerVersion(null, ds.projet),
  modifierVersion: (ds) => editerVersion(ds.id),
  nouveauRetour: (ds) => editerRetour(null, ds.projet),
  modifierRetour: (ds) => editerRetour(ds.id),
  basculerRetour: async (ds) => { const r = parId("retours", ds.id); try { await enregistrer("retours", { traite: !r.traite }, r.id); rendre(); } catch (err) { toast(msgErreur(err), "erreur"); } },
  ajouterDocument: (ds) => ajouterDocument({ client_id: ds.client || null, projet_id: ds.projet || null }),
  ouvrirDocument: (ds) => ouvrirDocument(ds.id),
  supprimerDocument: (ds) => supprimerDocument(ds.id),
  puce: (ds) => { const [pg, cle] = ds.filtre.split("."); filtres[pg][cle] = ds.valeur; rendre(); },
  theme: () => { appliquerTheme(document.documentElement.dataset.theme === "nuit" ? "jour" : "nuit", true); if (lireRoute().page === "reglages") rendre(); },
  deconnexion: async () => { await sb.auth.signOut(); },
  menu: () => $("#app").classList.toggle("menu-ouvert"),
};
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-fermer]")) { fermerModale(); return; }
  const a = e.target.closest("[data-action]");
  if (a && !a.closest("dialog")) {
    if (a.tagName !== "INPUT") e.preventDefault();
    const fn = ACTIONS[a.dataset.action];
    if (fn) fn(a.dataset, a);
    return;
  }
  const l = e.target.closest("[data-href]");
  if (l && !e.target.closest("a, button, input, select, label")) location.hash = l.dataset.href;
  if ($("#app").classList.contains("menu-ouvert") && !e.target.closest(".barre, [data-action=menu]")) $("#app").classList.remove("menu-ouvert");
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("article.tache[data-action]")) { e.preventDefault(); ACTIONS.modifierTache(e.target.dataset); }
});
const LISTES = { clients: ["#liste-clients", listeClients], projets: ["#liste-projets", listeProjets], devis: ["#liste-devis", listeDevis], taches: ["#liste-taches", listeTaches], documents: ["#liste-documents", listeDocuments] };
function majFiltre(el) {
  const [pg, cle] = el.dataset.filtre.split(".");
  filtres[pg][cle] = el.type === "checkbox" ? (el.checked ? "1" : "") : el.value;
  const [sel, fn] = LISTES[pg];
  const cible = $(sel);
  if (cible) { cible.innerHTML = fn(); apresRendu(pg); }
}
document.addEventListener("input", (e) => { if (e.target.matches('input[type="search"][data-filtre]')) majFiltre(e.target); });
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.matches("select[data-filtre], input[type=checkbox][data-filtre]")) { majFiltre(el); return; }
  if (el.matches("select[data-maj]")) {
    try { await enregistrer(el.dataset.maj, { [el.dataset.champ]: el.value }, el.dataset.id); toast("Statut mis à jour."); rendre(); }
    catch (err) { toast(msgErreur(err), "erreur"); rendre(); }
  }
});

/* ==========================================================================
   Thème (jour / nuit)
   ========================================================================== */
function appliquerTheme(t, memoriser) {
  document.documentElement.dataset.theme = t;
  if (memoriser) ecrireStockage("nexus-theme", t);
  const nuit = t === "nuit";
  $("#btn-theme").innerHTML = icone(nuit ? "soleil" : "lune") + (nuit ? "Jour" : "Nuit");
  $("#btn-theme").title = nuit ? "Passer en mode jour" : "Passer en mode nuit";
}
appliquerTheme(lireStockage("nexus-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "nuit" : "jour"));

/* ==========================================================================
   Connexion et démarrage
   ========================================================================== */
function messageAuth(texte, type) { const m = $("#auth-message"); m.hidden = !texte; m.className = "message " + (type || "erreur"); m.textContent = texte || ""; }
function afficherConnexion(texte, type) {
  $("#app").hidden = true; $("#ecran-connexion").hidden = false;
  $("#form-connexion").hidden = false; $("#form-nouveau-mdp").hidden = true;
  $("#auth-titre").textContent = "Connexion";
  messageAuth(texte, type);
}
function afficherNouveauMdp() {
  $("#app").hidden = true; $("#ecran-connexion").hidden = false;
  $("#form-connexion").hidden = true; $("#form-nouveau-mdp").hidden = false;
  $("#auth-titre").textContent = "Choisir un mot de passe";
  $("#auth-sous-titre").textContent = "Bienvenue. Choisissez votre mot de passe (8 caractères minimum).";
  messageAuth("");
}
async function entrer() {
  $("#ecran-connexion").hidden = true; $("#app").hidden = false;
  $("#contenu").innerHTML = '<div class="chargement"><span class="pointille" aria-label="Chargement"></span></div>';
  try { await chargerTout(); }
  catch (err) { $("#contenu").innerHTML = `<div class="message erreur">Chargement impossible : ${esc(msgErreur(err))}</div>`; return; }
  const m = moi();
  if (!m) {
    messageSortie = `Le compte ${session?.user?.email || ""} n’est relié à aucun membre actif de NexusLab. Demandez à un membre de l’ajouter dans Équipe.`;
    await sb.auth.signOut();
    afficherConnexion(`Le compte ${session?.user?.email || ""} n’est relié à aucun membre actif de NexusLab. Demandez à un membre de l’ajouter dans Équipe.`);
    return;
  }
  $("#utilisateur").innerHTML = `${avatar(m.id, "")}<div><div style="font-weight:700;color:#fff">${esc(m.nom)}</div><div style="font-size:.75rem;opacity:.75">${esc(m.role || "")}</div></div>`;
  if (!location.hash || /access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname + "#/accueil");
  rendre();
}
$("#form-connexion").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) return;
  const btn = $('[type="submit"]', e.target); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.mdp.value });
  btn.disabled = false;
  if (error) messageAuth(msgErreur(error));
});
$("#btn-oubli").addEventListener("click", async () => {
  const email = $("#form-connexion").email.value.trim();
  if (!email) { messageAuth("Indiquez d’abord votre e-mail ci-dessus."); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  messageAuth(error ? msgErreur(error) : "Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.", error ? "erreur" : "ok");
});
$("#form-nouveau-mdp").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.mdp.value !== e.target.mdp2.value) { messageAuth("Les deux mots de passe ne sont pas identiques."); return; }
  const { error } = await sb.auth.updateUser({ password: e.target.mdp.value });
  if (error) { messageAuth(msgErreur(error)); return; }
  e.target.reset();
  history.replaceState(null, "", location.pathname + "#/accueil");
  await entrer();
});

let dejaEntre = false;
let messageSortie = "";
async function demarrer() {
  if (!sb) { afficherConnexion("La base de données n’est pas encore configurée (URL et clé Supabase manquantes)."); $("#form-connexion").hidden = true; return; }
  const modeMdp = /type=(invite|recovery)/.test(location.hash);
  const erreurLien = /error_description/.test(location.hash);
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((evt, s) => {
    session = s;
    if (evt === "PASSWORD_RECOVERY") { afficherNouveauMdp(); return; }
    if (evt === "SIGNED_OUT") { dejaEntre = false; Object.keys(db).forEach((k) => (db[k] = [])); afficherConnexion(messageSortie); messageSortie = ""; return; }
    if (evt === "SIGNED_IN" && !dejaEntre && $("#form-nouveau-mdp").hidden) { dejaEntre = true; setTimeout(entrer, 0); }
  });
  if (erreurLien && !session) { history.replaceState(null, "", location.pathname); afficherConnexion("Ce lien a expiré ou a déjà été utilisé. Utilisez « Mot de passe oublié ? » pour en recevoir un nouveau."); return; }
  if (session && modeMdp) { afficherNouveauMdp(); return; }
  if (session) { dejaEntre = true; await entrer(); } else afficherConnexion();
}
// Données fraîches quand on revient sur l'onglet après quelques minutes
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !session || !dejaEntre || dlg.open || Date.now() - dernierChargement < 120000) return;
  try { await chargerTout(); rendre(); } catch { /* hors ligne : on garde l'affichage */ }
});
demarrer();
