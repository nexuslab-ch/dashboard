<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>NexusLab, dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==========================================================================
   NexusLab, dashboard interne. Tout le style est ici.
   Identité reprise du site nexus-lab.ch : graphite, blanc cassé, corail,
   boutons en pilule, verre dépoli, ombres douces. Mode jour et mode nuit.
   ========================================================================== */
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url("fonts/manrope-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap;
  src: url("fonts/manrope-latin-ext.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  --graphite: #1D1D1F; --graphite-2: #2C2C2E; --sur-graphite: #FAF9F7; --sur-graphite-2: #C7C7CC;
  --fond: #F4F3F0; --fond-2: #ECEAE5; --carte: #FFFFFF; --carte-haut: #FFFEFC; --champ: #FFFFFF;
  --texte: #1D1D1F; --texte-2: #515154; --texte-3: #6E6E73;
  --ligne: #E6E3DE; --ligne-forte: #D1CDC6;
  --corail: #FF5F57; --corail-fonce: #C43A32; --corail-doux: #FFE3E1; --corail-texte: #C43A32;
  --verre: rgba(255, 255, 255, 0.74); --verre-bord: rgba(29, 29, 31, 0.09);
  --lueur: rgba(255, 95, 87, 0.10);
  --ombre-s: 0 1px 2px rgba(29, 29, 31, 0.05), 0 8px 24px -12px rgba(29, 29, 31, 0.14);
  --ombre: 0 2px 4px rgba(29, 29, 31, 0.04), 0 12px 24px -8px rgba(29, 29, 31, 0.10), 0 32px 64px -24px rgba(29, 29, 31, 0.18);
  --ombre-verre: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 1px 2px rgba(29, 29, 31, 0.05), 0 12px 32px -12px rgba(29, 29, 31, 0.22);
  --rayon: 20px; --rayon-s: 12px; --pilule: 999px;
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --t-gris: #515154;   --t-gris-bg: #EDEEF0;
  --t-bleu: #34548A;   --t-bleu-bg: #E7EDF7;
  --t-vert: #2F6544;   --t-vert-bg: #E4EFE7;
  --t-jaune: #80560A;  --t-jaune-bg: #FAF0DA;
  --t-violet: #5A4699; --t-violet-bg: #EEEAF8;
  --t-corail: #C43A32; --t-corail-bg: #FFE3E1;
  --t-rouge: #A3241A;  --t-rouge-bg: #FBE1DD;
}
:root[data-theme="nuit"] {
  --graphite: #F5F5F7; --graphite-2: #E5E5EA; --sur-graphite: #1D1D1F; --sur-graphite-2: #3A3A3C;
  --fond: #0E0E10; --fond-2: #1A1A1D; --carte: #18181B; --carte-haut: #1C1C1F; --champ: #111113;
  --texte: #F5F5F7; --texte-2: #C7C7CC; --texte-3: #98989D;
  --ligne: #2C2C2E; --ligne-forte: #3A3A3C;
  --corail-doux: rgba(255, 95, 87, 0.16); --corail-texte: #FF8A84;
  --verre: rgba(24, 24, 27, 0.78); --verre-bord: rgba(255, 255, 255, 0.08);
  --lueur: rgba(255, 95, 87, 0.08);
  --ombre-s: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  --ombre: 0 2px 4px rgba(0, 0, 0, 0.3), 0 12px 24px -8px rgba(0, 0, 0, 0.4), 0 32px 64px -24px rgba(0, 0, 0, 0.5);
  --ombre-verre: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 32px -12px rgba(0, 0, 0, 0.6);
  --t-gris: #C7C7CC;   --t-gris-bg: rgba(199, 199, 204, 0.12);
  --t-bleu: #A9C1EC;   --t-bleu-bg: rgba(91, 127, 184, 0.22);
  --t-vert: #9FD0AE;   --t-vert-bg: rgba(110, 156, 126, 0.22);
  --t-jaune: #F2C670;  --t-jaune-bg: rgba(217, 162, 58, 0.2);
  --t-violet: #C6B8F0; --t-violet-bg: rgba(143, 123, 200, 0.24);
  --t-corail: #FF8A84; --t-corail-bg: rgba(255, 95, 87, 0.2);
  --t-rouge: #FF9B8F;  --t-rouge-bg: rgba(218, 41, 28, 0.22);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5;
  color: var(--texte); background: var(--fond); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  background-image: radial-gradient(900px 520px at 100% -10%, var(--lueur), transparent 70%), radial-gradient(700px 420px at -10% 110%, var(--lueur), transparent 70%);
  background-attachment: fixed;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; line-height: 1.2; }
h1 { font-size: clamp(1.6rem, 2.6vw, 2.15rem); font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: 1.05rem; font-weight: 800; }
h3 { font-size: .95rem; font-weight: 700; }
[hidden] { display: none !important; }
.muted { color: var(--texte-3); }
.petit { font-size: .82rem; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.retard { color: var(--t-rouge); font-weight: 700; }
:focus-visible { outline: 2px solid var(--corail); outline-offset: 2px; }
::selection { background: var(--corail-doux); }

/* Étiquette de section, comme sur le site : point corail + capitales */
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--corail-texte); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--corail); box-shadow: 0 0 0 4px var(--corail-doux); }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 11px; color: var(--texte); text-decoration: none; }
.logo-mark { width: 40px; height: 18px; flex: none; }
.logo-mark .dot-a, .logo-mark .link { fill: currentColor; }
.logo-mark .dot-b { fill: var(--corail); }
.logo-word { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.035em; line-height: 1; }

/* ---------- Connexion ---------- */
.ecran-auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.carte-auth { width: 100%; max-width: 410px; background: var(--verre); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--verre-bord); border-radius: 28px; padding: 34px 30px; box-shadow: var(--ombre); }
.carte-auth .logo { margin-bottom: 26px; }
.carte-auth h1 { font-size: 1.75rem; }
.carte-auth p.signature { color: var(--texte-2); margin: 8px 0 22px; }
.carte-auth form { display: grid; gap: 14px; }
.carte-auth label { font-size: .85rem; font-weight: 700; color: var(--texte-2); display: grid; gap: 6px; }
.carte-auth .lien { background: none; border: 0; padding: 0; color: var(--texte-2); text-decoration: underline; cursor: pointer; font-size: .88rem; justify-self: start; }
.message { padding: 11px 14px; border-radius: var(--rayon-s); font-size: .9rem; }
.message.erreur { background: var(--t-rouge-bg); color: var(--t-rouge); }
.message.ok { background: var(--t-vert-bg); color: var(--t-vert); }
.message.info { background: var(--fond-2); color: var(--texte-2); }

/* ---------- Structure : barre latérale flottante + contenu ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.barre { position: sticky; top: 12px; margin: 12px 0 12px 12px; height: calc(100vh - 24px); display: flex; flex-direction: column;
  background: var(--verre); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--verre-bord); border-radius: 24px; box-shadow: var(--ombre-verre); padding: 20px 12px 14px; overflow: hidden; }
.barre > .logo { padding: 2px 12px 18px; }
.nav { display: grid; gap: 1px; overflow-y: auto; padding: 0 2px; margin: 0 -2px; flex: 1; align-content: start; scrollbar-width: thin; }
.nav-groupe { font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-3); padding: 14px 12px 6px; }
.nav a { position: relative; display: flex; align-items: center; gap: 11px; padding: 8px 12px; border-radius: 12px; text-decoration: none; color: var(--texte-2); font-weight: 600; font-size: .92rem; transition: background .2s, color .2s; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: rgba(29, 29, 31, 0.06); color: var(--texte); }
:root[data-theme="nuit"] .nav a:hover { background: rgba(255, 255, 255, 0.06); }
.nav a[aria-current="page"] { background: var(--graphite); color: var(--sur-graphite); box-shadow: 0 8px 20px -10px rgba(29, 29, 31, 0.5); }
.nav a[aria-current="page"] svg { opacity: 1; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--corail); }
.nav a .compteur { margin-left: auto; background: var(--corail); color: #1D1D1F; font-size: .7rem; font-weight: 800; border-radius: var(--pilule); padding: 1px 7px; }
.nav a[aria-current="page"] .compteur { margin-right: 14px; }
.barre-pied { border-top: 1px solid var(--ligne); padding: 12px 4px 0; margin-top: 8px; }
.utilisateur { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 14px; text-decoration: none; }
.utilisateur:hover { background: rgba(29, 29, 31, 0.05); }
.utilisateur .nom { font-weight: 700; font-size: .9rem; }
.utilisateur .role { font-size: .74rem; color: var(--texte-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }

.colonne-principale { min-width: 0; display: flex; flex-direction: column; }
.haut { position: sticky; top: 12px; z-index: 40; margin: 12px 12px 0 18px; display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 8px 8px 10px;
  background: var(--verre); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border: 1px solid var(--verre-bord); border-radius: var(--pilule); box-shadow: var(--ombre-verre); }
.haut .menu-mobile { display: none; }
.recherche-btn { flex: 1; min-width: 0; max-width: 460px; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 16px; border-radius: var(--pilule);
  border: 1px solid var(--ligne); background: var(--champ); color: var(--texte-3); cursor: pointer; font-size: .9rem; text-align: left; }
.recherche-btn:hover { border-color: var(--ligne-forte); color: var(--texte-2); }
.recherche-btn svg { width: 17px; height: 17px; flex: none; }
.recherche-btn span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font-family: inherit; font-size: .72rem; font-weight: 700; border: 1px solid var(--ligne); border-bottom-width: 2px; border-radius: 7px; padding: 1px 7px; background: var(--fond); color: var(--texte-3); }
.haut .espace { flex: 1; }
.rond-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--ligne); background: var(--champ); color: var(--texte-2); cursor: pointer; }
.rond-btn:hover { color: var(--texte); border-color: var(--ligne-forte); }
.rond-btn svg { width: 18px; height: 18px; }
.menu-creer { position: relative; }
.menu-liste { position: absolute; right: 0; top: calc(100% + 10px); min-width: 230px; padding: 6px; border-radius: 18px; background: var(--carte); border: 1px solid var(--ligne); box-shadow: var(--ombre); display: grid; gap: 1px; z-index: 60; }
.menu-liste button { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 9px 12px; border: 0; background: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--texte); }
.menu-liste button:hover, .menu-liste button:focus-visible { background: var(--fond); }
.menu-liste button svg { width: 17px; height: 17px; color: var(--texte-3); }

main#contenu { padding: 30px 32px 72px 38px; min-width: 0; max-width: 1440px; width: 100%; }
main#contenu:focus { outline: none; }
.entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.entete .tag { margin-bottom: 10px; }
.entete .sous-titre { color: var(--texte-2); margin-top: 8px; max-width: 70ch; }
.entete .boutons { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fil { font-size: .85rem; margin-bottom: 10px; color: var(--texte-3); }
.fil a { color: var(--texte-2); text-decoration: none; }
.fil a:hover { color: var(--corail-texte); }

/* ---------- Boutons (pilules, comme le site) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--ligne-forte); background: var(--carte); color: var(--texte);
  border-radius: var(--pilule); padding: 9px 16px; font-weight: 700; font-size: .88rem; line-height: 1.1; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .25s var(--ease), background .2s, color .2s, box-shadow .25s, border-color .2s; }
.btn:hover { border-color: var(--graphite); transform: translateY(-1px); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primaire { background: var(--graphite); border-color: var(--graphite); color: var(--sur-graphite); box-shadow: 0 10px 24px -10px rgba(29, 29, 31, 0.45); }
.btn.primaire:hover { box-shadow: 0 14px 30px -10px rgba(29, 29, 31, 0.55); }
.btn.corail { background: var(--corail); border-color: var(--corail); color: #1D1D1F; }
.btn.corail:hover { background: #FF7A73; border-color: #FF7A73; }
.btn.danger { color: var(--t-rouge); border-color: transparent; background: transparent; }
.btn.danger:hover { background: var(--t-rouge-bg); transform: none; }
.btn.discret { border-color: transparent; background: transparent; color: var(--texte-2); padding: 7px 11px; }
.btn.discret:hover { background: var(--fond-2); color: var(--texte); transform: none; }
.btn.mini { padding: 5px 11px; font-size: .8rem; border-width: 1px; }
.btn[disabled] { opacity: .55; cursor: progress; transform: none; }
.btn.large { width: 100%; padding: 13px 16px; font-size: .95rem; }
.icone-btn { background: none; border: 0; cursor: pointer; color: var(--texte-2); font-size: 1.4rem; line-height: 1; padding: 4px 8px; border-radius: 10px; }
.icone-btn:hover { background: var(--fond-2); color: var(--texte); }

/* ---------- Cartes et grilles ---------- */
.carte { background: linear-gradient(180deg, var(--carte-haut) 0%, var(--carte) 100%); border: 1px solid var(--ligne); border-radius: var(--rayon);
  padding: 20px 22px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), var(--ombre-s); min-width: 0; }
.carte > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.carte > header .actions-carte { display: flex; gap: 6px; flex-wrap: wrap; }
.carte.sans-marge { padding: 0; overflow: hidden; }
.carte.sans-marge > header { padding: 18px 22px 0; }
.carte.sombre { background: var(--graphite); color: var(--sur-graphite); border-color: transparent; box-shadow: var(--ombre); position: relative; overflow: hidden; }
.carte.sombre::after { content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 95, 87, 0.45), transparent 70%); pointer-events: none; }
.carte.sombre .muted, .carte.sombre .sous { color: var(--sur-graphite-2); }
:root[data-theme="nuit"] .carte.sombre { background: linear-gradient(135deg, #26262A 0%, #18181B 100%); color: var(--texte); border: 1px solid var(--ligne-forte); }
:root[data-theme="nuit"] .carte.sombre .muted, :root[data-theme="nuit"] .carte.sombre .sous { color: var(--texte-2); }
:root[data-theme="nuit"] .carte.sombre .anneau { background: radial-gradient(closest-side, #222225 76%, transparent 78%), conic-gradient(var(--corail) calc(var(--p) * 1%), rgba(255, 255, 255, 0.12) 0); }
.grille { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-fiche { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; }
.g-accueil { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
.pile { display: grid; gap: 18px; align-content: start; min-width: 0; }
.deco-reseau { position: absolute; right: 18px; bottom: 14px; width: 150px; opacity: .55; pointer-events: none; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { position: relative; background: linear-gradient(180deg, var(--carte-haut), var(--carte)); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 16px 18px;
  box-shadow: var(--ombre-s); text-decoration: none; display: block; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.kpi:hover { transform: translateY(-3px); box-shadow: var(--ombre); }
.kpi .label { color: var(--texte-2); font-size: .8rem; font-weight: 700; }
.kpi .valeur { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.035em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .detail { font-size: .78rem; color: var(--texte-3); margin-top: 2px; }
.kpi.alerte .valeur { color: var(--corail-texte); }
.kpi.alerte::before { content: ""; position: absolute; top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--corail); box-shadow: 0 0 0 4px var(--corail-doux); }

/* ---------- Badges, avatars ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--pilule); font-size: .74rem; font-weight: 700; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.badge.sans-point::before { display: none; }
.t-gris { color: var(--t-gris); background: var(--t-gris-bg); }
.t-bleu { color: var(--t-bleu); background: var(--t-bleu-bg); }
.t-vert { color: var(--t-vert); background: var(--t-vert-bg); }
.t-jaune { color: var(--t-jaune); background: var(--t-jaune-bg); }
.t-violet { color: var(--t-violet); background: var(--t-violet-bg); }
.t-corail { color: var(--t-corail); background: var(--t-corail-bg); }
.t-rouge { color: var(--t-rouge); background: var(--t-rouge-bg); }
.avatar { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: .68rem; font-weight: 800; flex: none; letter-spacing: 0; box-shadow: 0 0 0 2px var(--carte); }
.avatar.vide { background: var(--fond-2); color: var(--texte-3); }
.avatar.grand { width: 54px; height: 54px; font-size: 1.05rem; }
.avatars { display: inline-flex; }
.avatars .avatar + .avatar { margin-left: -7px; }
.raci { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; color: var(--texte-3); font-weight: 800; }

/* ---------- Tableaux ---------- */
.table-wrap { overflow-x: auto; }
table.liste { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.liste th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--texte-3); font-weight: 800; padding: 12px 16px; border-bottom: 1px solid var(--ligne); white-space: nowrap; }
table.liste td { padding: 12px 16px; border-bottom: 1px solid var(--ligne); vertical-align: middle; }
table.liste tr:last-child td { border-bottom: 0; }
table.liste tr[data-href], table.liste tr[data-action] { cursor: pointer; transition: background .15s; }
table.liste tr[data-href]:hover td, table.liste tr[data-action]:hover td { background: var(--fond); }
table.liste td.fort { font-weight: 700; }
.vide-liste { padding: 28px 22px; color: var(--texte-3); text-align: center; font-size: .92rem; }
.vide-liste .btn { margin-top: 12px; }

/* ---------- Filtres ---------- */
.filtres { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.filtres input[type="search"], .filtres select { border: 1px solid var(--ligne-forte); background: var(--champ); border-radius: var(--pilule); padding: 8px 14px; min-width: 0; height: 40px; }
.filtres input[type="search"] { width: 270px; max-width: 100%; }
.puces { display: flex; gap: 6px; flex-wrap: wrap; }
.puce { border: 1px solid var(--ligne-forte); background: var(--carte); border-radius: var(--pilule); padding: 6px 13px; font-size: .82rem; font-weight: 700; cursor: pointer; color: var(--texte-2); }
.puce:hover { border-color: var(--graphite); }
.puce[aria-pressed="true"] { background: var(--graphite); border-color: var(--graphite); color: var(--sur-graphite); }
.puce .n { opacity: .65; margin-left: 5px; }
.onglets { display: inline-flex; background: var(--fond-2); border-radius: var(--pilule); padding: 4px; gap: 2px; }
.onglets button { border: 0; background: transparent; padding: 7px 15px; border-radius: var(--pilule); font-weight: 700; font-size: .84rem; cursor: pointer; color: var(--texte-2); }
.onglets button[aria-pressed="true"] { background: var(--carte); color: var(--texte); box-shadow: var(--ombre-s); }

/* ---------- Fiches ---------- */
dl.infos { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 18px; margin: 0; font-size: .9rem; }
dl.infos dt { color: var(--texte-3); font-weight: 600; }
dl.infos dd { margin: 0; overflow-wrap: anywhere; }
dl.infos a { color: var(--texte); text-decoration-color: var(--corail); text-underline-offset: 3px; }
.statut-rapide { border: 1px solid var(--ligne-forte); background: var(--champ); border-radius: var(--pilule); padding: 8px 14px; font-weight: 700; font-size: .85rem; height: 40px; }
.texte-libre { white-space: pre-wrap; font-size: .9rem; color: var(--texte-2); margin: 0; }
.ligne-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--ligne); }
.ligne-item:last-child { border-bottom: 0; }
.ligne-item .corps { flex: 1; min-width: 0; }
.ligne-item .titre { font-weight: 700; font-size: .92rem; }
.ligne-item .meta { color: var(--texte-3); font-size: .8rem; }
.ligne-item.cliquable { cursor: pointer; }
.ligne-item.cliquable:hover .titre { color: var(--corail-texte); }
.ligne-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--corail); margin-top: 2px; }
.fait .titre { text-decoration: line-through; color: var(--texte-3); }
.chrono { list-style: none; margin: 0; padding: 0; }
.chrono li { position: relative; padding: 0 0 14px 22px; font-size: .88rem; }
.chrono li::before { content: ""; position: absolute; left: 4px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--corail); }
.chrono li::after { content: ""; position: absolute; left: 7.5px; top: 18px; bottom: 0; width: 1px; background: var(--ligne); }
.chrono li:last-child::after { display: none; }
.chrono .quand { color: var(--texte-3); font-size: .78rem; }
.date-pastille { flex: none; width: 46px; text-align: center; border-radius: 12px; background: var(--fond-2); padding: 5px 0 4px; line-height: 1.05; }
.date-pastille b { display: block; font-size: 1.05rem; font-weight: 800; }
.date-pastille small { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--texte-3); }
.date-pastille.aujourdhui { background: var(--corail); color: #1D1D1F; }
.date-pastille.aujourdhui small { color: #1D1D1F; }

/* ---------- Barres et progression ---------- */
.barres { display: grid; gap: 10px; }
.barre-ligne { display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 10px; font-size: .86rem; text-decoration: none; }
.piste { height: 8px; background: var(--fond-2); border-radius: var(--pilule); overflow: hidden; display: block; }
.rempli { display: block; height: 100%; background: var(--corail); border-radius: var(--pilule); min-width: 2px; transition: width .6s var(--ease); }
.rempli.atteint { background: var(--t-vert); }
.barre-ligne:hover .rempli { background: var(--corail-fonce); }
.progression { display: grid; gap: 6px; }
.progression .ligne-haut { display: flex; justify-content: space-between; gap: 10px; font-size: .88rem; }
.progression .ligne-haut b { font-variant-numeric: tabular-nums; }
.anneau { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 800; font-size: .95rem;
  background: radial-gradient(closest-side, var(--carte) 76%, transparent 78%), conic-gradient(var(--corail) calc(var(--p) * 1%), var(--fond-2) 0); }
.carte.sombre .anneau { background: radial-gradient(closest-side, var(--graphite) 76%, transparent 78%), conic-gradient(var(--corail) calc(var(--p) * 1%), rgba(255, 255, 255, 0.12) 0); }

/* ---------- Offres ---------- */
.offres { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.offre { display: flex; flex-direction: column; gap: 10px; transition: transform .45s var(--ease), box-shadow .45s var(--ease); }
.offre:hover { transform: translateY(-4px); box-shadow: var(--ombre); }
.offre .prix { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; color: var(--corail-texte); }
.offre .prix small { font-size: .85rem; font-weight: 600; color: var(--texte-3); letter-spacing: 0; }
.offre ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: .9rem; font-weight: 600; }
.offre li { display: flex; gap: 9px; }
.offre li::before { content: "✓"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--corail-doux); color: var(--corail-texte); font-size: .7rem; font-weight: 800; display: grid; place-items: center; margin-top: 2px; }
.offre.inactive { opacity: .55; }
.offre footer { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 12px; border-top: 1px solid var(--ligne); }

/* ---------- Tableaux de cartes (tâches, pipeline) ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 10px; align-items: start; }
.colonne { background: var(--fond-2); border-radius: 18px; padding: 12px; min-height: 140px; }
.colonne > header { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 10px; gap: 8px; }
.colonne > header h3 { display: flex; align-items: center; gap: 8px; }
.colonne > header h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--point, var(--texte-3)); }
.colonne.survol { outline: 2px dashed var(--corail); outline-offset: -2px; }
.cartes { display: grid; gap: 9px; }
.tache { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 12px 13px; cursor: pointer; display: grid; gap: 7px; box-shadow: var(--ombre-s); transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.tache:hover { transform: translateY(-2px); box-shadow: var(--ombre); }
.tache.glisse { opacity: .5; }
.tache.bloquee { border-color: var(--t-rouge); box-shadow: inset 3px 0 0 var(--t-rouge), var(--ombre-s); }
.tache .titre { font-weight: 700; font-size: .9rem; line-height: 1.35; }
.tache .projet { font-size: .75rem; color: var(--texte-3); font-weight: 600; }
.tache .bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .76rem; color: var(--texte-2); }
.tache .bas .droite { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
.tache .relance { font-size: .76rem; font-weight: 700; color: var(--texte-2); }
.tache .relance.retard { color: var(--t-rouge); }
.resume-heures { display: flex; gap: 18px; flex-wrap: wrap; font-size: .86rem; color: var(--texte-2); margin-bottom: 14px; }
.resume-heures strong { color: var(--texte); }

/* ---------- Agenda ---------- */
.agenda-tete { display: flex; align-items: center; gap: 8px; }
.agenda-tete h2 { font-size: 1.25rem; min-width: 170px; text-transform: capitalize; }
.calendrier { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--ligne); border-radius: var(--rayon); overflow: hidden; background: var(--carte); box-shadow: var(--ombre-s); }
.calendrier .jour-nom { padding: 10px 10px 8px; font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--texte-3); border-bottom: 1px solid var(--ligne); background: var(--carte-haut); }
.calendrier .case { min-height: 116px; padding: 8px; border-right: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.calendrier .case:nth-child(7n) { border-right: 0; }
.calendrier .case.hors { background: var(--fond); }
.calendrier .case.hors .n { color: var(--texte-3); opacity: .6; }
.calendrier .case .n { font-size: .8rem; font-weight: 800; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.calendrier .case.auj .n { background: var(--corail); color: #1D1D1F; }
.evt { display: block; width: 100%; text-align: left; border: 0; cursor: pointer; font-size: .74rem; font-weight: 700; padding: 3px 7px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
.evt.plus { background: none; color: var(--texte-3); padding: 0 4px; }
.legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--texte-2); margin-top: 12px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 4px; display: inline-block; }
.agenda-liste { display: none; }

/* ---------- Objectifs, réunions, ressources, compétences ---------- */
.objectif { display: grid; gap: 16px; }
.objectif .tete { display: flex; align-items: center; gap: 18px; }
.objectif .indics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 22px; }
.source-auto { font-size: .7rem; font-weight: 700; color: var(--texte-3); }
.tops-flops { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tops-flops > div { border-radius: 14px; padding: 12px 14px; font-size: .88rem; white-space: pre-wrap; }
.tops-flops .tops { background: var(--t-vert-bg); }
.tops-flops .flops { background: var(--t-corail-bg); }
.tops-flops b { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
.ressources { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ressource { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.ressource:hover { transform: translateY(-3px); box-shadow: var(--ombre); }
.ressource .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; font-weight: 800; }
.ressource .ico svg { width: 19px; height: 19px; }
.ressource .titre { font-weight: 800; }
.ressource .desc { font-size: .84rem; color: var(--texte-2); }
.ressource .domaine { font-size: .74rem; color: var(--texte-3); margin-top: 4px; word-break: break-all; }
.niveau { display: inline-flex; gap: 4px; }
.niveau i { width: 10px; height: 10px; border-radius: 50%; background: var(--fond-2); border: 1px solid var(--ligne-forte); }
.niveau i.on { background: var(--corail); border-color: var(--corail); }
.niveau i.cible { border: 2px solid var(--corail); }

/* ---------- Équipe ---------- */
.membres { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-bottom: 18px; }
.membre-tete { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: var(--fond); border-radius: 12px; padding: 9px 11px; }
.stat .v { font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .7rem; color: var(--texte-3); font-weight: 700; }
.charge { height: 8px; background: var(--fond-2); border-radius: var(--pilule); overflow: hidden; }
.charge > div { height: 100%; background: var(--corail); border-radius: var(--pilule); }
.competences-liste { display: grid; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--ligne); }
.competence { display: flex; align-items: center; gap: 10px; font-size: .86rem; cursor: pointer; border-radius: 8px; }
.competence:hover .nom { color: var(--corail-texte); }
.competence .nom { flex: 1; font-weight: 600; }

/* ---------- Documents ---------- */
.groupe-docs + .groupe-docs { margin-top: 18px; }
.groupe-docs h3 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.sous-groupe { margin: 10px 0 0 0; }
.sous-groupe h4 { margin: 0 0 2px; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--texte-3); }
.icone-doc { width: 36px; height: 36px; border-radius: 11px; background: var(--corail-doux); color: var(--corail-texte); display: grid; place-items: center; font-size: .64rem; font-weight: 800; flex: none; text-transform: uppercase; }

/* ---------- Formulaires ---------- */
.grille-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.champ { display: grid; gap: 6px; min-width: 0; align-content: start; }
.champ.pleine { grid-column: 1 / -1; }
.champ label, .champ > .label { font-size: .8rem; font-weight: 700; color: var(--texte-2); }
.champ .req { color: var(--corail-texte); }
.champ small { color: var(--texte-3); font-size: .76rem; }
.champ input, .champ select, .champ textarea, .carte-auth input, .lignes input {
  width: 100%; border: 1px solid var(--ligne-forte); background: var(--champ); border-radius: 12px; padding: 10px 12px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.champ textarea { resize: vertical; }
.champ input:focus, .champ select:focus, .champ textarea:focus, .carte-auth input:focus, .lignes input:focus { outline: none; border-color: var(--graphite); box-shadow: 0 0 0 4px var(--corail-doux); }
.champ.case { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .9rem; color: var(--texte); align-self: end; padding-bottom: 9px; }
.champ.case input { width: 18px; height: 18px; accent-color: var(--corail); }
.choix-multiples { display: flex; flex-wrap: wrap; gap: 6px; }
.choix-multiples label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--ligne-forte); border-radius: var(--pilule); font-size: .84rem; font-weight: 600; color: var(--texte); cursor: pointer; }
.choix-multiples input { accent-color: var(--corail); }
.choix-multiples label:has(input:checked) { background: var(--graphite); color: var(--sur-graphite); border-color: var(--graphite); }

/* ---------- Fenêtres ---------- */
dialog { border: 0; padding: 0; border-radius: 26px; background: var(--carte); color: var(--texte); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35); }
dialog.large { width: min(940px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(17, 17, 19, 0.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
dialog[open] { animation: apparait .25s var(--ease); }
@keyframes apparait { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
.modale-form { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.modale-form > header { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 10px; }
.modale-form > header h2 { font-size: 1.2rem; letter-spacing: -0.025em; }
.modale-form > .corps { padding: 8px 24px 20px; overflow-y: auto; }
.modale-form > footer { display: flex; gap: 8px; align-items: center; padding: 14px 24px; border-top: 1px solid var(--ligne); flex-wrap: wrap; }
.espace { flex: 1; }
#confirmation { width: min(440px, calc(100vw - 32px)); }
#confirmation .corps { padding: 26px 24px 6px; }

/* Palette de recherche (Cmd+K) */
#palette { width: min(640px, calc(100vw - 32px)); margin-top: 12vh; padding: 0; }
.palette-champ { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--ligne); }
.palette-champ svg { width: 20px; height: 20px; color: var(--texte-3); flex: none; }
.palette-champ input { flex: 1; border: 0; background: transparent; font-size: 1.05rem; outline: none; }
.palette-resultats { max-height: 56vh; overflow-y: auto; padding: 8px; }
.palette-groupe { font-size: .68rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-3); padding: 10px 12px 4px; }
.palette-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer; text-decoration: none; }
.palette-item[aria-selected="true"] { background: var(--fond); }
.palette-item .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--fond-2); flex: none; }
.palette-item .ico svg { width: 16px; height: 16px; }
.palette-item .t { font-weight: 700; font-size: .92rem; }
.palette-item .m { font-size: .78rem; color: var(--texte-3); }
.palette-pied { display: flex; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--ligne); font-size: .76rem; color: var(--texte-3); }

/* Lignes de devis */
.lignes { width: 100%; border-collapse: collapse; margin-top: 4px; }
.lignes th { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--texte-3); text-align: left; padding: 6px 4px; }
.lignes td { padding: 4px; vertical-align: top; }
.lignes td.total { padding-top: 13px; font-weight: 700; }
.lignes .c-q { width: 90px; } .lignes .c-p { width: 130px; } .lignes .c-t { width: 120px; } .lignes .c-x { width: 36px; }
.totaux { display: grid; justify-content: end; gap: 4px; margin-top: 10px; font-size: .92rem; }
.totaux div { display: flex; gap: 24px; justify-content: space-between; min-width: 260px; }
.totaux .ttc { font-weight: 800; font-size: 1.05rem; border-top: 2px solid var(--corail); padding-top: 6px; margin-top: 4px; }
.separateur { grid-column: 1 / -1; border-top: 1px solid var(--ligne); margin: 4px 0; }

/* ---------- Notifications, chargement ---------- */
#toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 1000; }
.toast { background: #1D1D1F; color: #FAF9F7; padding: 12px 18px; border-radius: var(--pilule); font-size: .9rem; font-weight: 600; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28); max-width: 380px; display: flex; gap: 10px; align-items: center; animation: apparait .3s var(--ease); }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--corail); flex: none; }
.toast.erreur { background: #7A1D14; border-radius: 16px; }
.toast.erreur::before { background: #FFB0A3; }
.chargement { display: grid; place-items: center; min-height: 50vh; color: var(--texte-3); }
.pointille { display: inline-block; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ligne); border-top-color: var(--corail); animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Tablette et téléphone ---------- */
@media (max-width: 1180px) {
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-fiche, .g-accueil { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .barre { position: fixed; inset: 10px auto 10px 10px; height: auto; width: 272px; margin: 0; z-index: 70; transform: translateX(calc(-100% - 20px)); transition: transform .3s var(--ease); background: var(--carte); }
  .app.menu-ouvert .barre { transform: none; box-shadow: 0 0 0 100vmax rgba(17, 17, 19, 0.45), var(--ombre); }
  .haut { margin: 10px 10px 0; }
  .haut .menu-mobile { display: grid; }
  .recherche-btn kbd { display: none; }
  main#contenu { padding: 22px 16px 56px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .grille-form { grid-template-columns: 1fr; }
  .filtres input[type="search"] { width: 100%; }
  .masquer-mobile { display: none; }
  .barre-ligne { grid-template-columns: 100px 1fr 28px; }
  .calendrier { display: none; }
  .agenda-liste { display: grid; gap: 0; }
  .tops-flops { grid-template-columns: 1fr; }
  .creer-libelle { display: none; }
}
@media (max-width: 480px) {
  .recherche-btn { flex: 0 0 42px; padding: 0; justify-content: center; }
  .recherche-btn span { display: none; }
}
@media print {
  .barre, .haut, .entete .boutons, .filtres { display: none !important; }
  .app { display: block; }
  body { background: #fff; }
}

<body>

<!-- Écran de connexion -->
<div id="ecran-connexion" class="ecran-auth" hidden>
  <div class="carte-auth">
    <span class="logo" aria-label="NexusLab">
      <svg class="logo-mark" viewBox="0 0 48 22" aria-hidden="true"><rect class="link" x="18" y="7.9" width="10" height="6.2" rx="1"/><circle class="dot-a" cx="11" cy="11" r="10.5"/><circle class="dot-b" cx="36.5" cy="11" r="10.5"/></svg>
      <span class="logo-word">nexus</span>
    </span>

    input = `<select id="${id}" name="${c.nom}"${req}>${vides}${c.options.map(([k, l]) => `<option value="${esc(k)}"${String(v ?? "") === String(k) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  } else {
    const extra = (c.step ? ` step="${c.step}"` : "") + (c.min != null ? ` min="${c.min}"` : "") + (c.placeholder ? ` placeholder="${esc(c.placeholder)}"` : "") + (c.liste ? ` list="${c.liste}"` : "") + (c.auto ? ` autocomplete="${c.auto}"` : "");
    input = `<input id="${id}" name="${c.nom}" type="${c.type || "text"}" value="${esc(v ?? "")}"${extra}${req}>`;
  }
  return `<div class="${cls}"><label for="${id}">${esc(c.label)}${c.requis ? ' <span class="req">*</span>' : ""}</label>${input}${c.aide ? `<small>${esc(c.aide)}</small>` : ""}</div>`;
}
function lireForm(form, champs) {
  const o = {};
  for (const c of champs) {
    if (c.type === "separateur" || c.lectureSeule) continue;
    if (c.type === "multi") { o[c.nom] = $$(`input[name="${c.nom}"]:checked`, form).map((x) => x.value); continue; }
    const el = form.elements[c.nom];
    if (!el) continue;
    if (c.type === "checkbox") o[c.nom] = el.checked;
    else if (c.type === "number") o[c.nom] = el.value === "" ? (c.defaut ?? null) : Number(el.value);
    else if (c.type === "liste") o[c.nom] = el.value.split("\n").map((s) => s.trim()).filter(Boolean);
    else { const s = el.value.trim(); o[c.nom] = s === "" ? (c.defaut ?? null) : s; }
  }
  return o;
}
/* Ouvre une modale avec un formulaire généré à partir d'une liste de champs. */
function formulaire({ titre, champs, valeurs = {}, enregistrer: surEnregistrer, supprimer, large, texteBouton = "Enregistrer", extra = "", apresOuverture }) {
  dlg.className = large ? "large" : "";
  dlg.innerHTML = `<form class="modale-form" novalidate>
    <header><h2>${esc(titre)}</h2><button type="button" class="icone-btn" data-fermer aria-label="Fermer">×</button></header>
    <div class="corps"><div class="grille-form">${champs.map((c) => champHtml(c, valeurs[c.nom])).join("")}</div>${extra}</div>
    <footer>${supprimer ? '<button type="button" class="btn danger" data-suppr>Supprimer</button>' : ""}<span class="espace"></span>
      <button type="button" class="btn" data-fermer>Annuler</button><button type="submit" class="btn primaire">${esc(texteBouton)}</button></footer></form>`;
  const form = $("form", dlg);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = $('[type="submit"]', form);
    btn.disabled = true;
    try { await surEnregistrer(lireForm(form, champs), form); fermerModale(); rendre(); }
    catch (err) { toast(msgErreur(err), "erreur"); }
    finally { btn.disabled = false; }
  });
  if (supprimer) $("[data-suppr]", form).addEventListener("click", async () => {
    if (!(await confirmer("Supprimer définitivement cet élément ?"))) return;
    try { await supprimer(); fermerModale(); rendre(); toast("Supprimé."); }
    catch (err) { toast(msgErreur(err), "erreur"); }
  });
  dlg.showModal();
  if (apresOuverture) apresOuverture(form);
  const premier = $("input:not([type=checkbox]),select,textarea", form);
  if (premier) premier.focus();
}

function brancherGlisserPipeline() {
  if (filtres.clients.vue !== "pipeline" || lireRoute().id) return;
  let glisse = null;
  for (const c of $$("[data-client]")) {
    c.addEventListener("dragstart", (e) => { glisse = c.dataset.client; c.classList.add("glisse"); e.dataTransfer.effectAllowed = "move"; });
    c.addEventListener("dragend", () => c.classList.remove("glisse"));
  }
  for (const col of $$("[data-statut-client]")) {
    col.addEventListener("dragover", (e) => { e.preventDefault(); col.classList.add("survol"); });
    col.addEventListener("dragleave", () => col.classList.remove("survol"));
    col.addEventListener("drop", async (e) => {
      e.preventDefault(); col.classList.remove("survol");
      const c = parId("clients", glisse);
      if (!c || c.statut === col.dataset.statutClient) return;
      try { await enregistrer("clients", { statut: col.dataset.statutClient }, c.id); toast(`${c.nom} : ${libelle("statutClient", col.dataset.statutClient)}`); rendre(); }
      catch (err) { toast(msgErreur(err), "erreur"); }
    });
  }
}

      <section class="carte"><header><h2>Prochaine étape</h2></header><p class="texte-libre" style="color:var(--texte);font-weight:600">${esc(p.prochaine_etape || "À définir")}</p>${p.notes ? `<p class="texte-libre" style="margin-top:10px">${esc(p.notes)}</p>` : ""}</section>
      <section class="carte"><header><h2>Journal des versions</h2><button class="btn mini" data-action="nouvelleVersion" data-projet="${p.id}">${icone("plus")}Version</button></header>
        ${versions.length ? `<ul class="chrono">${versions.map((v) => `<li class="ligne-item cliquable" style="border:0;padding:0 0 14px 22px;display:block" data-action="modifierVersion" data-id="${v.id}"><div class="titre">${esc(v.numero)}</div>${v.notes ? `<div class="petit">${esc(v.notes)}</div>` : ""}<div class="quand">${dateFr(v.date)}</div></li>`).join("")}</ul>` : '<div class="vide-liste">Aucune version notée.</div>'}</section>
    </div>

      <section class="carte"><header><h2>Retours clients <span class="muted petit">${retours.filter((r) => !r.traite).length} à traiter</span></h2><button class="btn mini" data-action="nouveauRetour" data-projet="${p.id}">${icone("plus")}Retour</button></header>

      <section class="carte sans-marge"><header><h2>Devis et factures</h2><button class="btn mini" data-action="nouveauDf" data-type="devis" data-client="${p.client_id || ""}" data-projet="${p.id}">${icone("plus")}Devis</button></header><div style="padding:8px 8px 6px">${tableDf(df, false)}</div></section>
      <section class="carte"><header><h2>Documents</h2><button class="btn mini" data-action="ajouterDocument" data-client="${p.client_id || ""}" data-projet="${p.id}">${icone("plus")}Ajouter</button></header>${listeDocs(docs)}</section>

function listeDevis() {

  const l = db.devis_factures.filter((d) => (!f.type || d.type === f.type) && (!f.statut || d.statut === f.statut) && (!q || [d.numero, nomClient(d.client_id), d.objet].join(" ").toLowerCase().includes(q)));

function nouvelleLigneHtml(l = {}) {
  return `<tr><td><input data-l="description" value="${esc(l.description || "")}" placeholder="Prestation" aria-label="Description"></td>
    <td class="c-q"><input data-l="quantite" type="number" step="0.25" min="0" value="${l.quantite ?? 1}" aria-label="Quantité"></td>
    <td class="c-p"><input data-l="prix" type="number" step="0.05" value="${l.prix ?? 0}" aria-label="Prix unitaire"></td>
    <td class="c-t num total"></td><td class="c-x"><button type="button" class="icone-btn" data-suppr-ligne aria-label="Retirer la ligne">×</button></td></tr>`;
}
function editeurDf(id, defauts = {}) {
  const p = parametres();
  const ex = parId("devis_factures", id);
  const type = ex ? ex.type : defauts.type || "devis";
  const d = ex ? { ...ex } : {
    type, client_id: defauts.client_id || null, projet_id: defauts.projet_id || null, objet: "",
    lignes: [{ description: "", quantite: 1, prix: 0 }], taux_tva: Number(p.taux_tva_defaut || 0), statut: "brouillon",
    date_emission: aujourdhui(), echeance: ajouterJours(aujourdhui(), type === "facture" ? p.delai_paiement_jours || 30 : p.validite_devis_jours || 30),
  };
  const champs = [
    { nom: "client_id", label: "Client", type: "select", options: optClients(), requis: true, vide: "Choisir un client" },
    { nom: "projet_id", label: "Site lié", type: "select", options: optProjets() },
    { nom: "objet", label: "Objet", pleine: true, placeholder: type === "devis" ? "Création du site vitrine" : "Création du site vitrine, solde" },
    { nom: "date_emission", label: "Date", type: "date", requis: true },
    { nom: "echeance", label: type === "facture" ? "Échéance de paiement" : "Valable jusqu’au", type: "date" },
    { nom: "statut", label: "Statut", type: "select", options: options("statutDf", STATUTS_DF_PAR_TYPE[type]), vide: false, defaut: "brouillon" },
    { nom: "taux_tva", label: "TVA (%)", type: "number", step: "0.1", min: 0, defaut: 0, aide: Number(p.taux_tva_defaut) ? "" : "0 tant que NexusLab n’est pas assujetti." },
    ...(type === "facture" ? [{ nom: "date_paiement", label: "Payée le", type: "date" }] : []),
    { nom: "notes", label: "Remarques (imprimées sur le PDF)", type: "textarea", pleine: true, rows: 2 },
  ];
  const lignes = Array.isArray(d.lignes) && d.lignes.length ? d.lignes : [{ description: "", quantite: 1, prix: 0 }];
  const extra = `<h3 style="margin:18px 0 4px">Prestations</h3>
    <div class="table-wrap"><table class="lignes"><thead><tr><th>Description</th><th class="c-q">Quantité</th><th class="c-p">Prix unitaire</th><th class="c-t num">Total</th><th class="c-x"></th></tr></thead><tbody id="lignes-corps">${lignes.map(nouvelleLigneHtml).join("")}</tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button type="button" class="btn mini" id="ajout-ligne">${icone("plus")}Ligne</button>
      <select id="ajout-offre" class="statut-rapide" aria-label="Ajouter une offre"><option value="">Ajouter une offre...</option>${db.offres.filter((o) => o.active).map((o) => `<option value="${o.id}">${esc(o.nom)} (${chfCourt(o.prix_depart)})</option>`).join("")}</select></div>
    <div class="totaux" id="totaux"></div>`;
  const titre = ex ? `${type === "devis" ? "Devis" : "Facture"} ${ex.numero}` : type === "devis" ? "Nouveau devis" : "Nouvelle facture";
  let pdfApres = false;

  formulaire({
    titre, champs, valeurs: d, extra, large: true,
    enregistrer: async (v, form) => {
      const avecPdf = pdfApres; pdfApres = false;
      const lg = $$("#lignes-corps tr", form).map((tr) => ({
        description: $('[data-l="description"]', tr).value.trim(),
        quantite: Number($('[data-l="quantite"]', tr).value) || 0,
        prix: Number($('[data-l="prix"]', tr).value) || 0,
      })).filter((l) => l.description || l.prix);
      if (!lg.length) throw new Error("Ajoutez au moins une prestation.");
      v.lignes = lg;
      v.montant_ht = arrondi(lg.reduce((s, l) => s + arrondi(l.quantite * l.prix), 0));
      if (v.statut === "paye" && !v.date_paiement) v.date_paiement = aujourdhui();
      let r;
      if (ex) r = await enregistrer("devis_factures", v, id);
      else {
        const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: type });
        if (error) throw error;
        r = await enregistrer("devis_factures", { ...v, type, numero });
      }
      toast(`${type === "devis" ? "Devis" : "Facture"} ${r.numero} enregistré${type === "facture" ? "e" : ""}.`);
      if (avecPdf) await telechargerPdf(r.id);
    },
    supprimer: ex ? () => supprimerLigne("devis_factures", id) : null,
    apresOuverture: (form) => {
      const corps = $("#lignes-corps", form);
      const recalcul = () => {
        let ht = 0;
        for (const tr of $$("tr", corps)) {
          const t = arrondi((Number($('[data-l="quantite"]', tr).value) || 0) * (Number($('[data-l="prix"]', tr).value) || 0));
          ht += t; $(".total", tr).textContent = fmtNombre.format(t);
        }
        ht = arrondi(ht);
        const taux = Number(form.elements.taux_tva.value) || 0, tva = arrondi((ht * taux) / 100);
        $("#totaux", form).innerHTML = `<div><span>Sous-total HT</span><span class="num">${chf(ht)}</span></div>${taux ? `<div><span>TVA ${taux} %</span><span class="num">${chf(tva)}</span></div>` : ""}<div class="ttc"><span>Total</span><span class="num">${chf(ht + tva)}</span></div>`;
      };
      form.addEventListener("input", recalcul);
      corps.addEventListener("click", (e) => { if (e.target.closest("[data-suppr-ligne]")) { e.target.closest("tr").remove(); if (!$("tr", corps)) corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); recalcul(); } });
      $("#ajout-ligne", form).addEventListener("click", () => { corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml()); $("tr:last-child input", corps).focus(); recalcul(); });
      $("#ajout-offre", form).addEventListener("change", (e) => {
        const o = parId("offres", e.target.value); e.target.value = "";
        if (!o) return;
        const premiere = $("tr", corps);
        if (corps.children.length === 1 && premiere && !$('[data-l="description"]', premiere).value) premiere.remove();
        corps.insertAdjacentHTML("beforeend", nouvelleLigneHtml({ description: `Offre ${o.nom}${o.periode !== "unique" ? " (" + libelle("periode", o.periode).toLowerCase() + ")" : ""}`, quantite: 1, prix: Number(o.prix_depart || 0) }));
        if (!form.elements.objet.value) form.elements.objet.value = "Offre " + o.nom;
        recalcul();
      });
      form.elements.projet_id.addEventListener("change", (e) => { const pr = parId("projets", e.target.value); if (pr?.client_id && !form.elements.client_id.value) form.elements.client_id.value = pr.client_id; });
      recalcul();
      // Boutons supplémentaires : PDF, transformer en facture, payée
      const pied = $("footer", form), envoi = $('[type="submit"]', pied);
      const bPdf = document.createElement("button");
      bPdf.type = "button"; bPdf.className = "btn"; bPdf.innerHTML = icone("pdf") + "Enregistrer et PDF";
      bPdf.addEventListener("click", () => { pdfApres = true; form.requestSubmit(envoi); });
      envoi.addEventListener("click", () => (pdfApres = false));
      pied.insertBefore(bPdf, envoi);
      if (ex && ex.type === "devis" && ["envoye", "accepte"].includes(ex.statut)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Transformer en facture";
        b.addEventListener("click", () => facturerDevis(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
      if (ex && ex.type === "facture" && ex.statut === "envoye") {
        const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Marquer payée";
        b.addEventListener("click", () => marquerPayee(ex.id)); pied.insertBefore(b, $("[data-fermer]", pied));
      }
    },
  });
}
async function facturerDevis(id) {
  const d = parId("devis_factures", id);
  if (!d || !(await confirmer(`Créer une facture à partir du devis ${d.numero} ?`, "Créer la facture"))) return;
  try {
    const p = parametres();
    const { data: numero, error } = await sb.rpc("prochain_numero", { p_type: "facture" });
    if (error) throw error;
    const f = await enregistrer("devis_factures", {
      type: "facture", numero, client_id: d.client_id, projet_id: d.projet_id, objet: d.objet, lignes: d.lignes,
      montant_ht: d.montant_ht, taux_tva: d.taux_tva, statut: "brouillon", date_emission: aujourdhui(),
      echeance: ajouterJours(aujourdhui(), p.delai_paiement_jours || 30), devis_origine_id: d.id, notes: d.notes,
    });
    await enregistrer("devis_factures", { statut: "facture" }, d.id);
    const c = parId("clients", d.client_id);
    if (c && ["prospect", "contacte", "rendez_vous", "offre_envoyee"].includes(c.statut)) await enregistrer("clients", { statut: "mandat_signe" }, c.id);
    fermerModale(); rendre(); toast(`Facture ${f.numero} créée.`);
    editeurDf(f.id);
  } catch (err) { toast(msgErreur(err), "erreur"); }
}
async function marquerPayee(id) {
  try { await enregistrer("devis_factures", { statut: "paye", date_paiement: aujourdhui() }, id); fermerModale(); rendre(); toast("Facture marquée payée."); }
  catch (err) { toast(msgErreur(err), "erreur"); }
}

function carteTache(t) {
  const h = t.heures_estimees != null || t.heures_reelles != null ? `<span title="Heures réelles / estimées">${(Number(t.heures_reelles) || 0).toLocaleString("fr-CH")} / ${(Number(t.heures_estimees) || 0).toLocaleString("fr-CH")} h</span>` : "";
  return `<article class="tache${t.statut === "bloque" ? " bloquee" : ""}" draggable="true" data-id="${t.id}" data-action="modifierTache" tabindex="0">
    ${t.projet_id ? `<div class="projet">${esc(nomProjet(t.projet_id))}</div>` : ""}
    <div class="titre">${esc(t.titre)}</div>

function ibanNettoye(i) { return String(i || "").replace(/\s+/g, "").toUpperCase(); }
function ibanValide(i) {
  const s = ibanNettoye(i);
  if (!/^(CH|LI)\d{2}[0-9A-Z]{17}$/.test(s)) return false;
  const r = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, (c) => c.charCodeAt(0) - 55);
  let m = 0; for (const ch of r) m = (m * 10 + Number(ch)) % 97;
  return m === 1;
}

function chargerScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("Impossible de charger l’outil PDF. Vérifiez la connexion.")); document.head.appendChild(s); });
}
async function chargerLibsPdf() {

  if (!window.qrcode) await chargerScript(LIBS_PDF[1]);
}
/* Helvetica (PDF standard) ne connaît que l'alphabet Windows-1252 : on retire le reste. */
function pdfTexte(s) {
  return String(s ?? "").replace(/[\r\n\t]+/g, " ").replace(/[‐-―−]/g, "-").replace(/[   ]/g, " ")
    .replace(/[^\x20-\x7E\xA0-\xFF‘’“”…€Œœ]/g, "");
}
function couper(texte, police, taille, largeur) {
  const lignes = [];
  for (const para of String(texte ?? "").split(/\n/)) {
    const mots = pdfTexte(para).split(" ");
    let l = "";
    for (const m of mots) {
      const essai = l ? l + " " + m : m;
      if (police.widthOfTextAtSize(essai, taille) <= largeur || !l) l = essai; else { lignes.push(l); l = m; }
    }
    lignes.push(l);
  }
  return lignes;
}
function estQrIban(iban) { const iid = Number(ibanNettoye(iban).slice(4, 9)); return iid >= 30000 && iid <= 31999; }
/* Référence QR (27 chiffres, contrôle modulo 10 récursif) à partir du numéro de facture */
function referenceQrr(numero) {
  const base = (String(numero).replace(/\D/g, "") || "0").slice(-26).padStart(26, "0");
  const table = [0, 9, 4, 6, 8, 2, 7, 1, 3, 5];
  let report = 0;
  for (const ch of base) report = table[(report + Number(ch)) % 10];
  return base + ((10 - report) % 10);

const groupeRef = (r) => r.slice(0, 2) + " " + r.slice(2).replace(/(\d{5})(?=\d)/g, "$1 ");

  page.drawCircle({ x: x0 + 36.5 * s, y: haut - 11 * s, size: 10.5 * s, color: C.corail });

}

function dessinerQrFacture(page, f, fb, d, p, client, C, mm, W) {
  const iban = ibanNettoye(p.iban), qrIban = estQrIban(iban);
  const reference = qrIban ? referenceQrr(d.numero) : "";
  const message = pdfTexte(`${d.numero}${d.objet ? " " + d.objet : ""}`).slice(0, 140);
  const deb = client && client.nom && client.npa && client.localite ? client : null;
  const coupe = (s, n) => pdfTexte(s || "").slice(0, n);
  const donnees = [
    "SPC", "0200", "1", iban,
    "S", coupe(p.raison_sociale, 70), coupe(p.adresse, 70), "", coupe(p.npa, 16), coupe(p.localite, 35), (p.pays || "CH").slice(0, 2),
    "", "", "", "", "", "", "",
    Number(d.montant_ttc).toFixed(2), "CHF",
    ...(deb ? ["S", coupe(deb.nom, 70), coupe(deb.adresse, 70), "", coupe(deb.npa, 16), coupe(deb.localite, 35), "CH"] : ["", "", "", "", "", "", ""]),
    qrIban ? "QRR" : "NON", reference, message, "EPD",
  ].join("\n");

  const T = (s, x, y, font, size) => page.drawText(pdfTexte(s), { x, y, size, font, color: C.noir });
  const haut = mm(105);
  // Lignes de découpe
  page.drawLine({ start: { x: 0, y: haut }, end: { x: W, y: haut }, thickness: 0.5, color: C.noir, dashArray: [3, 2] });
  page.drawLine({ start: { x: mm(62), y: 0 }, end: { x: mm(62), y: haut }, thickness: 0.5, color: C.noir, dashArray: [3, 2] });
  const avis = "Séparer avant paiement";
  T(avis, W / 2 - f.widthOfTextAtSize(avis, 7) / 2, haut + 3, f, 7);

  const creancier = [groupeIban(iban), p.raison_sociale, p.adresse, [p.npa, p.localite].filter(Boolean).join(" ")].filter(Boolean);
  const debiteur = deb ? [deb.nom, deb.adresse, [deb.npa, deb.localite].join(" ")].filter(Boolean) : null;
  const cadre = (x, y, w, h) => {
    const k = mm(3), o = { thickness: 0.75, color: C.noir };
    [[x, y + h, x + k, y + h], [x, y + h, x, y + h - k], [x + w, y + h, x + w - k, y + h], [x + w, y + h, x + w, y + h - k],

  };

  // Récépissé (gauche, 62 mm)
  let x = mm(5), y = haut - mm(5) - 11;
  T("Récépissé", x, y, fb, 11); y -= 18;
  T("Compte / Payable à", x, y, fb, 6); y -= 9;
  for (const l of creancier) { T(l, x, y, f, 8); y -= 9; }
  if (reference) { y -= 4; T("Référence", x, y, fb, 6); y -= 9; T(groupeRef(reference), x, y, f, 8); y -= 9; }
  y -= 4; T("Payable par", x, y, fb, 6); y -= 9;
  if (debiteur) for (const l of debiteur) { T(l, x, y, f, 8); y -= 9; }
  else cadre(x, y - mm(20) + 6, mm(52), mm(20));
  T("Monnaie", x, mm(33), fb, 6); T("Montant", x + mm(13), mm(33), fb, 6);
  T("CHF", x, mm(29), f, 8); T(montantQr(d.montant_ttc), x + mm(13), mm(29), f, 8);
  const depot = "Point de dépôt";
  T(depot, mm(57) - fb.widthOfTextAtSize(depot, 6), mm(19), fb, 6);

  // Section paiement (droite)
  x = mm(67); y = haut - mm(5) - 11;
  T("Section paiement", x, y, fb, 11);
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const qr = qrcode(0, "M"); qr.addData(donnees, "Byte"); qr.make();
  const n = qr.getModuleCount(), taille = mm(46), cell = taille / n, qx = mm(67), qy = mm(42);
  // Un seul tracé, modules sombres regroupés par ligne et légèrement chevauchants : pas de joints blancs

  // Croix suisse au centre
  const cx = qx + taille / 2, cy = qy + taille / 2;
  page.drawRectangle({ x: cx - mm(3.5), y: cy - mm(3.5), width: mm(7), height: mm(7), color: C.blanc });
  page.drawRectangle({ x: cx - mm(3.05), y: cy - mm(3.05), width: mm(6.1), height: mm(6.1), color: C.noir });
  page.drawRectangle({ x: cx - mm(1.95), y: cy - mm(0.6), width: mm(3.9), height: mm(1.2), color: C.blanc });
  page.drawRectangle({ x: cx - mm(0.6), y: cy - mm(1.95), width: mm(1.2), height: mm(3.9), color: C.blanc });
  T("Monnaie", x, mm(33), fb, 8); T("Montant", x + mm(14), mm(33), fb, 8);
  T("CHF", x, mm(28.5), f, 10); T(montantQr(d.montant_ttc), x + mm(14), mm(28.5), f, 10);

  x = mm(118); y = haut - mm(5) - 8;
  T("Compte / Payable à", x, y, fb, 8); y -= 11;
  for (const l of creancier) { T(l, x, y, f, 10); y -= 11; }

  y -= 5; T("Payable par", x, y, fb, 8); y -= 11;
  if (debiteur) for (const l of debiteur) { T(l, x, y, f, 10); y -= 11; }
  else cadre(x, y - mm(25) + 8, mm(65), mm(25));
}

async function telechargerPdf(id) {
  const d = parId("devis_factures", id);
  if (!d) return;
  toast("Préparation du PDF...");
  try {
    const octets = await genererPdf(d);
    const blob = new Blob([octets], { type: "application/pdf" });
    const nom = `${d.numero} ${nomClient(d.client_id)}`.trim();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nomFichierSur(nom) + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    // Archive dans la GED (classé par client et par site)
    const chemin = `${d.client_id || "sans-client"}/${d.projet_id || "general"}/${nomFichierSur(d.numero)}.pdf`;
    const { error } = await sb.storage.from(CONFIG.bucket).upload(chemin, blob, { contentType: "application/pdf", upsert: true });
    if (error) throw error;
    const { error: e2 } = await sb.from("documents").upsert({ client_id: d.client_id, projet_id: d.projet_id, nom: `${d.numero}.pdf`, type: d.type, fichier_path: chemin, taille: blob.size, mime: "application/pdf", date: aujourdhui() }, { onConflict: "fichier_path" });
    if (e2) throw e2;
    if (d.pdf_path !== chemin) await enregistrer("devis_factures", { pdf_path: chemin }, d.id);
    await charger("documents");
    rendre();
  } catch (err) { console.error(err); toast("PDF : " + msgErreur(err), "erreur"); }
}

/* ==========================================================================

const TYPES_EVT = {
  tache: ["Tâche", "bleu"], reunion: ["Réunion", "violet"], relance: ["Relance client", "jaune"], facture: ["Paiement attendu", "corail"],
  devis: ["Fin de validité d’un devis", "gris"], mise_en_ligne: ["Mise en ligne", "vert"], objectif: ["Objectif", "rouge"],

function evenements(debut, fin, membreId) {

  for (const r of db.reunions) if (dans(r.date) && (!membreId || !(r.participants || []).length || r.participants.includes(membreId)))
    ev.push({ date: r.date, type: "reunion", titre: r.titre, meta: [r.heure, libelle("typeReunion", r.type), r.lieu].filter(Boolean).join(" · "), href: "#/reunions/" + r.id });
  if (!membreId) {
    for (const c of db.clients) if (dans(c.date_relance) && !["termine", "perdu", "livre"].includes(c.statut))
      ev.push({ date: c.date_relance, type: "relance", titre: "Relancer " + c.nom, meta: c.prochaine_action || c.contact || "", href: "#/clients/" + c.id });
    for (const d of db.devis_factures) {
      if (d.type === "facture" && d.statut === "envoye" && dans(d.echeance)) ev.push({ date: d.echeance, type: "facture", titre: `Facture ${d.numero}`, meta: nomClient(d.client_id) + " · " + chf(d.montant_ttc), action: "modifierDf", id: d.id });
      if (d.type === "devis" && d.statut === "envoye" && dans(d.echeance)) ev.push({ date: d.echeance, type: "devis", titre: `Devis ${d.numero} expire`, meta: nomClient(d.client_id), action: "modifierDf", id: d.id });
    }
    for (const p of db.projets) if (dans(p.date_mise_en_ligne)) ev.push({ date: p.date_mise_en_ligne, type: "mise_en_ligne", titre: "Mise en ligne : " + p.nom, meta: nomClient(p.client_id), href: "#/projets/" + p.id });
    for (const o of db.objectifs) {
      if (dans(o.debut)) ev.push({ date: o.debut, type: "objectif", titre: "Début : " + o.titre, meta: "Objectif", href: "#/objectifs" });
      if (dans(o.fin)) ev.push({ date: o.fin, type: "objectif", titre: "Fin : " + o.titre, meta: "Objectif", href: "#/objectifs" });

  return ev.sort((a, b) => a.date.localeCompare(b.date) || a.type.localeCompare(b.type));
}
const attrsEvt = (e) => (e.href ? `data-href="${e.href}"` : `data-action="${e.action}" data-id="${e.id}"`);

function pageAgenda() {

  const m = moi();
  if (!m) {
    messageSortie = `Le compte ${session?.user?.email || ""} n’est relié à aucun membre actif de NexusLab. Demandez à un membre de l’ajouter dans Équipe.`;
    await sb.auth.signOut();
    afficherConnexion(`Le compte ${session?.user?.email || ""} n’est relié à aucun membre actif de NexusLab. Demandez à un membre de l’ajouter dans Équipe.`);
    return;
  }
  $("#utilisateur").innerHTML = `${avatar(m.id, "")}<div style="min-width:0"><div class="nom">${esc(m.nom)}</div><div class="role">${esc(m.role || "")}</div></div>`;
  $("#raccourci-k").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";
  if (!location.hash || /access_token|type=/.test(location.hash)) history.replaceState(null, "", location.pathname + "#/accueil");
  rendre();
}
$("#form-connexion").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) return;
  const btn = $('[type="submit"]', e.target); btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.mdp.value });
  btn.disabled = false;
  if (error) messageAuth(msgErreur(error));
});
$("#btn-oubli").addEventListener("click", async () => {
  const email = $("#form-connexion").email.value.trim();
  if (!email) { messageAuth("Indiquez d’abord votre e-mail ci-dessus."); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  messageAuth(error ? msgErreur(error) : "Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.", error ? "erreur" : "ok");
});
$("#form-nouveau-mdp").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (e.target.mdp.value !== e.target.mdp2.value) { messageAuth("Les deux mots de passe ne sont pas identiques."); return; }
  const { error } = await sb.auth.updateUser({ password: e.target.mdp.value });
  if (error) { messageAuth(msgErreur(error)); return; }
  e.target.reset();
  history.replaceState(null, "", location.pathname + "#/accueil");
  await entrer();
});

let dejaEntre = false;
let messageSortie = "";
async function demarrer() {
  if (!sb) { afficherConnexion("La base de données n’est pas encore configurée (URL et clé Supabase manquantes)."); $("#form-connexion").hidden = true; return; }
  const modeMdp = /type=(invite|recovery)/.test(location.hash);
  const erreurLien = /error_description/.test(location.hash);
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((evt, s) => {
    session = s;
    if (evt === "PASSWORD_RECOVERY") { afficherNouveauMdp(); return; }
    if (evt === "SIGNED_OUT") { dejaEntre = false; Object.keys(db).forEach((k) => (db[k] = [])); afficherConnexion(messageSortie); messageSortie = ""; return; }
    if (evt === "SIGNED_IN" && !dejaEntre && $("#form-nouveau-mdp").hidden) { dejaEntre = true; setTimeout(entrer, 0); }
  });
  if (erreurLien && !session) { history.replaceState(null, "", location.pathname); afficherConnexion("Ce lien a expiré ou a déjà été utilisé. Utilisez « Mot de passe oublié ? » pour en recevoir un nouveau."); return; }
  if (session && modeMdp) { afficherNouveauMdp(); return; }
  if (session) { dejaEntre = true; await entrer(); } else afficherConnexion();
}
// Données fraîches quand on revient sur l'onglet après quelques minutes
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !session || !dejaEntre || dlg.open || Date.now() - dernierChargement < 120000) return;
  try { await chargerTout(); rendre(); } catch { /* hors ligne : on garde l'affichage */ }
});
demarrer();
</script>
